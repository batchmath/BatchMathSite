<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#030303"/>
  <g aria-hidden="true">
    <text x="7" y="49" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="900" fill="#d71920">B</text>
    <text x="34" y="49" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="900" fill="#d71920">M</text>
    <!-- Crown simplified from the crown used in the BatchMath homepage portrait. -->
    <g transform="translate(3 2) scale(.43)">
      <path d="M4 31 L7 8 L22 24 L26 5 L40 23 L49 3 L58 23 L72 5 L76 24 L91 8 L94 31 Z"
            fill="#f5d92f" stroke="#d57b52" stroke-width="3.2" stroke-linejoin="round"/>
      <!-- alternating rounded jewels/points echo the portrait crown -->
      <circle cx="7" cy="8" r="4.7" fill="#f5d92f" stroke="#d57b52" stroke-width="2.5"/>
      <circle cx="26" cy="5" r="4.7" fill="#b85d39" stroke="#d57b52" stroke-width="2"/>
      <circle cx="49" cy="3" r="4.7" fill="#f5d92f" stroke="#d57b52" stroke-width="2.5"/>
      <circle cx="72" cy="5" r="4.7" fill="#b85d39" stroke="#d57b52" stroke-width="2"/>
      <circle cx="91" cy="8" r="4.7" fill="#f5d92f" stroke="#d57b52" stroke-width="2.5"/>
      <!-- darker bowls beneath the two filled points -->
      <path d="M17 20 Q26 34 35 20 Q31 30 26 31 Q21 30 17 20Z" fill="#a95a39" opacity=".9"/>
      <path d="M63 20 Q72 34 81 20 Q77 30 72 31 Q67 30 63 20Z" fill="#a95a39" opacity=".9"/>
      <!-- side red jewels and center diamond -->
      <ellipse cx="10" cy="31" rx="3.2" ry="6.2" fill="#b51f35" transform="rotate(-14 10 31)"/>
      <ellipse cx="88" cy="31" rx="3.2" ry="6.2" fill="#b51f35" transform="rotate(14 88 31)"/>
      <path d="M49 22 L56 31 L49 40 L42 31 Z" fill="#b51f35"/>
      <!-- double gold base like the portrait -->
      <rect x="7" y="34" width="84" height="8" rx="3.5" fill="#f5d92f" stroke="#d57b52" stroke-width="3"/>
      <rect x="11" y="43" width="76" height="6" rx="3" fill="#f5d92f" stroke="#d57b52" stroke-width="2.8"/>
    </g>
  </g>
</svg>

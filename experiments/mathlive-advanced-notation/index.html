<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BatchMath notation scratchpad</title>
<link rel="stylesheet" href="../../assets/mathlive/pilot.css"><style>body{background:#030303;color:#fff;font:18px Arial;margin:0;padding:28px}main{max-width:850px;margin:auto}h1{color:#f5c400}button,select{background:#151515;color:#fff;border:1px solid #d71920;border-radius:6px;padding:10px;margin:4px}textarea{display:block;width:100%;min-height:90px;background:#080808;color:#fff;border:1px solid #f5c400;box-sizing:border-box}math-field{margin:18px 0;min-height:100px}p{line-height:1.5}</style></head><body><main>
<h1>BatchMath notation scratchpad</h1><p>Editable notation for integration testing. This scratchpad does not grade or evaluate expressions. The practice engines accept only the answer forms supported by their existing checkers.</p>
<label>Template <select id="template"><option value="indefinite">Indefinite integral</option><option value="definite">Definite integral</option><option value="double">Double integral</option><option value="sum">Summation</option><option value="limit">Limit</option><option value="subscript">Indexed variable</option><option value="delta">Delta x</option></select></label><button id="insert">Insert template</button><button id="clear">Clear</button><button id="slot">Next empty slot</button>
<div id="field"></div><details><summary>Copy the LaTeX</summary><textarea id="latex" readonly aria-label="Expression in LaTeX"></textarea></details><p id="status" role="status"></p>
</main><script type="module" src="notation.mjs"></script></body></html>

<title>Offline | BatchMath</title>
<style>
:root{color-scheme:dark;--bg:#030303;--panel:#090909;--red:#d71920;--yellow:#f5c400;--text:#f4f4f4;--muted:#b9b9b9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
main{width:min(620px,100%);border:1px solid #333;border-radius:14px;background:var(--panel);padding:clamp(26px,6vw,48px);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.brand{font-size:clamp(2.2rem,8vw,4rem);font-weight:950;letter-spacing:-.055em;color:var(--red);margin-bottom:22px}.brand span{color:var(--yellow)}
h1{color:var(--yellow);margin:0 0 12px;font-size:clamp(1.7rem,5vw,2.5rem)}p{color:var(--muted);line-height:1.65;margin:0 auto 22px;max-width:500px}
a{display:inline-block;color:var(--yellow);border:1px solid var(--red);border-radius:9px;padding:10px 15px;text-decoration:none;font-weight:850;background:#111}a:hover{background:#190a0a}
</style>

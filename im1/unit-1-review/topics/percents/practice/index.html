<style>:root{--setting-cols:2;--stat-cols:2;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#030303;color:#f4f4f4}
.page{max-width:900px;margin:0 auto;padding:24px 18px 42px}
.back{display:inline-block;color:#f5c400;text-decoration:none;font-weight:800;margin-bottom:14px}
.header{text-align:center;margin:14px 0 18px}.header h1{margin:0;color:#d71920;font-size:2rem}.header p{max-width:700px;margin:9px auto 0;color:#bdbdbd;line-height:1.4}
.card{background:#090909;border:1px solid #292929;border-radius:14px;padding:22px;margin-bottom:16px}.hidden{display:none!important}
.settings{display:grid;grid-template-columns:repeat(var(--setting-cols,3),minmax(0,1fr));gap:16px;max-width:780px;margin:0 auto}.setting label{display:block;color:#f5c400;font-weight:800;margin-bottom:8px}
select,#answer{width:100%;padding:11px 12px;border:2px solid #363636;border-radius:9px;background:#111;color:#fff;font-size:1rem}
button{border:0;border-radius:9px;padding:11px 18px;font-size:1rem;font-weight:800;cursor:pointer}.primary,.check,.next{background:#d71920;color:#fff}.primary{display:block;margin:20px auto 0}.check,.next{display:block;margin:12px auto 0}.next{background:#f5c400;color:#080808}
.stats{display:grid;grid-template-columns:repeat(var(--stat-cols,3),1fr);gap:9px;margin-bottom:16px}.stat{text-align:center;background:#121212;color:#f5c400;border-radius:9px;padding:9px;font-weight:800}.stat span{display:block;margin-top:2px;font-size:1.2rem}
.question-area{text-align:center}.question{margin:10px 0 16px;color:#f5c400;font-size:clamp(1.75rem,5vw,3rem);font-weight:900;line-height:1.25}.question.word{font-size:clamp(1.12rem,3.1vw,1.55rem);line-height:1.42;max-width:760px;margin-left:auto;margin-right:auto}
#answer{display:block;width:min(300px,100%);margin:0 auto;text-align:center;font-size:1.55rem}.feedback{min-height:46px;max-width:720px;margin:12px auto 0;font-size:.98rem;font-weight:700;line-height:1.42}.feedback strong{color:#fff}.correct{color:#f5c400}.incorrect{color:#ff6469}.results{text-align:center}.big-score{font-size:3rem;font-weight:900;color:#f5c400}.results p{color:#aaa}.instruction{max-width:720px;margin:0 auto 14px;color:#c8c8c8;line-height:1.4;text-align:center;font-size:.96rem}
.choice-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:760px;margin:0 auto}.choice{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border:1px solid #333;border-radius:9px;background:#111;font-weight:800;cursor:pointer}.choice input{width:18px;height:18px;accent-color:#d71920}
@media(max-width:720px){.page{padding:16px 10px 32px}.header{margin:10px 0 14px}.header h1{font-size:1.65rem}.header p{font-size:.92rem}.settings{grid-template-columns:1fr}.stats{grid-template-columns:repeat(var(--stat-cols,3),1fr);gap:6px;margin-bottom:12px}.stat{font-size:.86rem;padding:8px 4px}.stat span{font-size:1.05rem}.card{padding:14px 10px}.question{font-size:clamp(1.5rem,7vw,2.25rem);margin:8px 0 12px}.question.word{font-size:1.06rem}.instruction{font-size:.9rem;margin-bottom:10px}.feedback{font-size:.92rem}.choice-grid{grid-template-columns:1fr 1fr}.choice:last-child{grid-column:1/-1;max-width:50%;width:100%;justify-self:center}}</style><link rel="stylesheet" href="../../../../../assets/im1-keypad.css"><script defer src="../../../../../assets/im1-keypad.js"></script><script src="../../../../../assets/im1-display-math.js"></script></head><body><main class="page"><a class="back" href="../">← Topic Page</a>
<header class="header"><h1>Percents</h1><p>Untimed practice finding percents and solving applications involving values above 100%, discounts, markups, sales tax, and successive percent changes.</p></header>
<section id="setupCard" class="card"><div class="settings"><div class="setting"><label for="categorySelect">Practice Type</label><select id="categorySelect"><option value="mixed" selected>Mixed Percents</option><option value="percent">Percent of a Number</option><option value="original">Percent of Original Value</option><option value="discount">Discounts &amp; Markups</option><option value="tax">Discount + Tax</option><option value="successive">Successive Percent Changes</option></select></div><div class="setting"><label for="questionSelect">Number of Questions</label><select id="questionSelect"><option value="10">10 questions</option><option value="20" selected>20 questions</option><option value="30">30 questions</option><option value="40">40 questions</option><option value="50">50 questions</option><option value="60">60 questions</option><option value="70">70 questions</option><option value="80">80 questions</option><option value="90">90 questions</option><option value="100">100 questions</option></select></div></div><button id="startBtn" class="primary">Start Practice</button></section>
<section id="practiceCard" class="card hidden"><div class="stats"><div class="stat">Question<span id="progress"></span></div><div class="stat">Score<span id="score">0</span></div></div><div class="question-area"><div id="question" class="question word"></div><input id="answer" type="text" autocomplete="off" aria-label="Answer" data-bm-keypad="decimal"><button id="checkBtn" class="check">Check Answer</button><div id="feedback" class="feedback" aria-live="polite"></div><button id="nextBtn" class="next hidden">Next Question</button></div></section>
<section id="resultsCard" class="card results hidden"><h2>Practice Complete</h2><div id="finalScore" class="big-score"></div><p id="finalMessage"></p><button id="againBtn" class="primary">Practice Again</button></section></main>
<script>const $=id=>document.getElementById(id);
let total=20,idx=0,score=0,answered=0,advanceId=null,pool=[],finished=false,accepting=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function nextQuestion(){if(finished)return;idx++;showQuestion()}
function showExplanation(html){$("feedback").innerHTML=html;$("feedback").className="feedback incorrect";$("nextBtn").classList.remove("hidden");}
function resetFeedback(){$("feedback").textContent="";$("feedback").className="feedback";$("nextBtn").classList.add("hidden")}
function finish(){if(finished)return;finished=true;clearTimeout(advanceId);$("practiceCard").classList.add("hidden");$("resultsCard").classList.remove("hidden");$("finalScore").textContent=`${score} correct`;$("finalMessage").textContent=`You completed all ${pool.length} questions.`}
function again(){$("resultsCard").classList.add("hidden");$("setupCard").classList.remove("hidden")}

const percents=[5,10,12,15,20,25,30,35,40,50,60,75,80,90,125,150,180,200,250];
function round2(n){return Math.round((n+Number.EPSILON)*100)/100}
function money(n){const x=round2(n);return Number.isInteger(x)?`$${x}`:`$${x.toFixed(2)}`}
function chooseBaseFor(p){const vals=[];for(let b=20;b<=1000;b+=10)if((p*b)%100===0)vals.push(b);return pick(vals)}
function percentAmount(p,b){return round2(p*b/100)}
function makePercent(){const p=pick(percents),b=chooseBaseFor(p),ans=percentAmount(p,b);return{id:`p-${p}-${b}`,q:`What is ${p}% of ${b}?`,answer:ans,money:false,kind:"percent",explain:`${p}% means ${p}/100. Multiply: (${p}/100)×${b} = <strong>${ans}</strong>.`}}
function makeOriginal(){const p=pick([125,150,175,180,200,250]),b=chooseBaseFor(p),ans=percentAmount(p,b);return{id:`o-${p}-${b}`,q:`An item is now worth ${p}% of its original value of ${money(b)}. What is it worth now?`,answer:ans,money:true,kind:"original",explain:`Find ${p}% of ${money(b)}: (${p}/100)×${b} = <strong>${money(ans)}</strong>. Because ${p}% is above 100%, the new value is larger than the original.`}}
function makeDiscountMarkup(){const b=pick([40,60,80,100,120,150,160,200,240,250,300,400,500,600]),p=pick([10,20,25,30,40,50]),up=Math.random()<.35,change=percentAmount(p,b),ans=round2(b+(up?change:-change));return{id:`dm-${b}-${p}-${up}`,q:`A ${money(b)} item is ${up?"marked up":"discounted"} ${p}%. What is the new price?`,answer:ans,money:true,kind:"discount",explain:`First find ${p}% of ${money(b)}: (${p}/100)×${b} = ${money(change)}. ${up?"Add":"Subtract"} that amount: ${money(b)} ${up?"+":"−"} ${money(change)} = <strong>${money(ans)}</strong>.`}}
function makeTax(){for(let tries=0;tries<300;tries++){const b=ri(4,100)*10,disc=pick([10,20,25,30,40,50]),tax=pick([5,8,10]),discount=percentAmount(disc,b),sale=round2(b-discount),taxAmt=percentAmount(tax,sale),ans=round2(sale+taxAmt);if(Number.isInteger(ans))return{id:`t-${b}-${disc}-${tax}`,q:`A ${money(b)} item is ${disc}% off. Then ${tax}% sales tax is added to the sale price. What is the final cost?`,answer:ans,money:true,kind:"tax",explain:`Discount first: ${disc}% of ${money(b)} is ${money(discount)}, so the sale price is ${money(sale)}. Tax is ${tax}% of the <em>sale price</em>: ${money(taxAmt)}. Add it: ${money(sale)} + ${money(taxAmt)} = <strong>${money(ans)}</strong>.`}}return makeDiscountMarkup()}
function makeSuccessive(){for(let tries=0;tries<500;tries++){const kind=pick(["upup","downdown","updown","upthenloss"]),b=ri(4,100)*10,p1=pick([10,20,25,30,40,50]),p2=pick([10,20,25,30]);let q,ans,mid,explain,moneyFlag;if(kind==="upup"){mid=round2(b*(1+p1/100));ans=round2(mid*(1+p2/100));if(!Number.isInteger(ans))continue;q=`A quantity starts at ${b}. It increases by ${p1}%, then increases by ${p2}% of the new total. What is the final amount?`;explain=`After the first increase: ${b} + ${p1}% of ${b} = ${mid}. The second percent uses the <em>new</em> total: ${mid} + ${p2}% of ${mid} = <strong>${ans}</strong>.`;moneyFlag=false}else if(kind==="downdown"){mid=round2(b*(1-p1/100));ans=round2(mid*(1-p2/100));q=`A ${money(b)} item is discounted ${p1}%, then an additional ${p2}% off the sale price. What is the final price?`;explain=`First discount gives ${money(mid)}. The second ${p2}% discount is taken from ${money(mid)}, not the original price, giving <strong>${money(ans)}</strong>.`;moneyFlag=true}else if(kind==="updown"){mid=round2(b*(1+p1/100));ans=round2(mid*(1-p2/100));q=`A ${money(b)} item is marked up ${p1}%, then the new price is discounted ${p2}%. What is the final price?`;explain=`Markup first: ${money(b)} becomes ${money(mid)}. Then take ${p2}% off ${money(mid)} to get <strong>${money(ans)}</strong>.`;moneyFlag=true}else{mid=round2(b*(1+p1/100));ans=round2(mid*(1-p2/100));if(!Number.isInteger(ans))continue;q=`A group starts with ${b} people. Registration increases by ${p1}%, then ${p2}% of that new total does not attend. How many people attend?`;explain=`Registration first becomes ${mid}. Then ${p2}% of ${mid} do not attend, so ${100-p2}% attend: <strong>${ans}</strong> people.`;moneyFlag=false}return{id:`s-${kind}-${b}-${p1}-${p2}`,q,answer:ans,money:moneyFlag,kind:"successive",explain}}return makePercent()}
function makeQuestion(cat){if(cat==="percent")return makePercent();if(cat==="original")return makeOriginal();if(cat==="discount")return makeDiscountMarkup();if(cat==="tax")return makeTax();if(cat==="successive")return makeSuccessive();return pick([makePercent,makeOriginal,makeDiscountMarkup,makeTax,makeSuccessive])()}
function buildPool(category,totalNeeded){const out=[],seen=new Set();for(let tries=0;out.length<totalNeeded&&tries<25000;tries++){const q=makeQuestion(category);if(!seen.has(q.id)){seen.add(q.id);out.push(q)}}return out}
function parseAmount(raw){const s=String(raw).trim().replace(/[$,\s]/g,"");const n=Number(s);return Number.isFinite(n)?n:null}
function answerDisplay(q){return q.money?money(q.answer):String(round2(q.answer))}

function startPractice(){clearTimeout(advanceId);total=Number($("questionSelect").value);idx=0;score=0;answered=0;finished=false;pool=buildPool($("categorySelect").value,total);$("setupCard").classList.add("hidden");$("resultsCard").classList.add("hidden");$("practiceCard").classList.remove("hidden");showQuestion()}
function showQuestion(){if(finished)return;if(idx>=pool.length)return finish();const q=pool[idx];$("progress").textContent=`${idx+1} / ${pool.length}`;$("score").textContent=score;$("question").className="question word";$("question").textContent=q.q;$("answer").value="";$("answer").disabled=false;$("checkBtn").disabled=false;resetFeedback();accepting=true;if(!window.BatchMathKeypad?.touchMode) $("answer").focus()}
function submit(){if(!accepting||finished)return;const q=pool[idx],n=parseAmount($("answer").value);if(n===null)return;accepting=false;$("answer").disabled=true;$("checkBtn").disabled=true;answered++;if(Math.abs(n-q.answer)<.005){score++;$("score").textContent=score;$("feedback").textContent="✓ Correct";$("feedback").className="feedback correct";advanceId=setTimeout(nextQuestion,180)}else{showExplanation(`✗ Incorrect. Correct answer: <strong>${answerDisplay(q)}</strong><br>${q.explain}`)}}
$("checkBtn").onclick=submit;$("nextBtn").onclick=nextQuestion;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(!$("nextBtn").classList.contains("hidden"))nextQuestion();else submit()}});$("startBtn").onclick=startPractice;$("againBtn").onclick=again;
</script><script data-batchmath-local-preview="1">
(function(){
  if (window.location.protocol !== 'file:') return;
  function localizeDirectoryUrl(value){
    if (!value || /^(?:[a-z][a-z0-9+.-]*:|#|\/)/i.test(value)) return value;
    var hash = '';
    var query = '';
    var hashAt = value.indexOf('#');
    if (hashAt >= 0) { hash = value.slice(hashAt); value = value.slice(0, hashAt); }
    var queryAt = value.indexOf('?');
    if (queryAt >= 0) { query = value.slice(queryAt); value = value.slice(0, queryAt); }
    if (value.endsWith('/')) value += 'index.html';
    return value + query + hash;
  }
  document.querySelectorAll('a[href]').forEach(function(link){
    link.setAttribute('href', localizeDirectoryUrl(link.getAttribute('href')));
  });
  document.querySelectorAll('option[value]').forEach(function(option){
    option.setAttribute('value', localizeDirectoryUrl(option.getAttribute('value')));
  });
})();
</script>

<script>
(function(){
  const backLink = document.querySelector('.back, .batch-back');
  if (!backLink) return;

  const params = new URLSearchParams(window.location.search);
  const source = params.get('from');
  const referrerIsUnitPractice = /\/im1\/unit-1-review\/practice\/(?:index\.html)?(?:[?#].*)?$/.test(document.referrer || '');
  const backHref = value => {
    if (window.location.protocol !== 'file:') return value;
    let hash = '', query = '';
    const hashAt = value.indexOf('#'); if (hashAt >= 0) { hash = value.slice(hashAt); value = value.slice(0, hashAt); }
    const queryAt = value.indexOf('?'); if (queryAt >= 0) { query = value.slice(queryAt); value = value.slice(0, queryAt); }
    if (value.endsWith('/')) value += 'index.html';
    return value + query + hash;
  };

  if (source === 'unit-practice' || (!source && referrerIsUnitPractice)) {
    backLink.href = backHref('../../../practice/');
    backLink.textContent = '← Unit 1 Practice';
  } else {
    backLink.href = backHref('../');
    backLink.textContent = '← Topic Page';
  }
})();
</script>

<header class="header"><h1>Order of Operations</h1><p>Mixed practice with multiplication, grouping symbols, exponents, square roots, nested expressions, and fraction bars used as grouping symbols.</p></header>
<section id="setupCard" class="card"><div class="settings"><div class="setting"><label for="timeSelect">Time Limit</label><select id="timeSelect"><option value="1">1 minute</option><option value="2">2 minutes</option><option value="3" selected>3 minutes</option><option value="4">4 minutes</option><option value="5">5 minutes</option></select></div><div class="setting"><label for="questionSelect">Number of Questions</label><select id="questionSelect"><option value="10">10 questions</option><option value="20" selected>20 questions</option><option value="30">30 questions</option><option value="40">40 questions</option><option value="50">50 questions</option><option value="60">60 questions</option><option value="70">70 questions</option><option value="80">80 questions</option><option value="90">90 questions</option><option value="100">100 questions</option></select></div></div><button id="startBtn" class="primary">Start Practice</button></section>
<section id="practiceCard" class="card hidden"><div class="stats"><div class="stat">Question<span id="progress"></span></div><div class="stat">Score<span id="score">0</span></div><div class="stat">Time<span id="timer"></span></div></div><div class="question-area"><div id="question" class="question"></div><input id="answer" type="text" autocomplete="off" aria-label="Answer" data-bm-keypad="integer"><button id="checkBtn" class="check">Check Answer</button><div id="feedback" class="feedback" aria-live="polite"></div><button id="nextBtn" class="next hidden">Next Question</button></div></section>

<script>const $=id=>document.getElementById(id);
let total=20,idx=0,score=0,answered=0,left=180,timerId=null,advanceId=null,pool=[],finished=false,accepting=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function timeText(){const m=Math.floor(left/60),s=left%60;$("timer").textContent=`${m}:${String(s).padStart(2,"0")}`}
function tick(){clearInterval(timerId);timeText();timerId=setInterval(()=>{left--;if(left<=0){left=0;timeText();finish("time")}else timeText()},1000)}
function typeset(nodes){if(window.MathJax&&MathJax.typesetPromise){if(MathJax.typesetClear)MathJax.typesetClear(nodes);MathJax.typesetPromise(nodes).catch(()=>{})}}
function nextQuestion(){if(finished)return;idx++;showQuestion()}
function showExplanation(html){$("feedback").innerHTML=html;$("feedback").className="feedback incorrect";$("nextBtn").classList.remove("hidden");typeset([$("feedback")]);}
function resetFeedback(){$("feedback").textContent="";$("feedback").className="feedback";$("nextBtn").classList.add("hidden")}
function finish(reason){if(finished)return;finished=true;clearInterval(timerId);clearTimeout(advanceId);$("practiceCard").classList.add("hidden");$("resultsCard").classList.remove("hidden");$("finalScore").textContent=`${score} correct`;$("finalMessage").textContent=reason==="time"?`Time is up. You answered ${answered} question${answered===1?"":"s"}.`:`You completed all ${pool.length} questions.`}
function again(){$("resultsCard").classList.add("hidden");$("setupCard").classList.remove("hidden")}

function startPractice(){clearInterval(timerId);clearTimeout(advanceId);total=Number($("questionSelect").value);left=Number($("timeSelect").value)*60;idx=0;score=0;answered=0;finished=false;pool=buildPool(total);$("setupCard").classList.add("hidden");$("resultsCard").classList.add("hidden");$("practiceCard").classList.remove("hidden");tick();showQuestion()}

function result(family,id,q,answer,steps){return{family,id,q,answer,explain:`${steps} <strong>${answer}</strong>.`}}
function factorPair(n,min=2,max=12){
  const pairs=[];
  for(let a=min;a<=max;a++)if(n%a===0){const b=n/a;if(b>=min&&b<=max)pairs.push([a,b])}
  return pairs.length?pick(pairs):null;
}
function smallDivisor(n){
  const ds=[];
  for(let d=2;d<=12;d++)if(Math.abs(n)%d===0)ds.push(d);
  return ds.length?pick(ds):null;
}
function plusMinusText(a,b,op){return op==='+'?`${a}+${b}`:`${a}-${b}`}

// Twelve approved Order of Operations families. Each draw chooses one family
// with the same probability. Exact visible problems do not repeat in a session.

// 1. Addition/subtraction combined with multiplication.
function make1(){
  const a=ri(4,30),b=ri(2,9),c=ri(2,9),op=pick(['+','-']),prod=b*c;
  const ans=op==='+'?a+prod:a-prod;
  return result(1,`1-${a}-${b}-${c}-${op}`,String.raw`\(${a}${op}(${b})(${c})\)`,ans,
    `Multiply first: ${b}×${c}=${prod}. Then ${plusMinusText(a,prod,op)}=`);
}

// 2. Parentheses containing an exponent, then multiplied.
function make2(){
  const b=ri(2,5),e=pick([2,3]),pow=b**e,a=ri(2,18),c=ri(2,6),sign=pick([1,-1]),op=pick(['+','-']);
  const inside=op==='+'?a+pow:a-pow, multiplier=sign*c, ans=inside*multiplier;
  const multText=multiplier<0?`(-${c})`:`(${c})`;
  return result(2,`2-${a}-${b}-${e}-${c}-${sign}-${op}`,String.raw`\((${a}${op}${b}^{${e}})${multText}\)`,ans,
    `Exponent first: ${b}^${e}=${pow}. Parentheses: ${plusMinusText(a,pow,op)}=${inside}. Then ${inside}×${multiplier}=`);
}

// 3. A grouped expression raised to a power, combined with another power.
function make3(){
  const a=ri(1,7),b=ri(1,7),groupOp=pick(['+','-']),inside=groupOp==='+'?a+b:a-b;
  const e1=pick([2,3]),c=ri(2,5),e2=pick([2,3]),outsideOp=pick(['+','-']);
  const left=inside**e1,right=c**e2,ans=outsideOp==='+'?left+right:left-right;
  return result(3,`3-${a}-${b}-${groupOp}-${e1}-${c}-${e2}-${outsideOp}`,String.raw`\((${a}${groupOp}${b})^{${e1}}${outsideOp}${c}^{${e2}}\)`,ans,
    `Parentheses first: ${plusMinusText(a,b,groupOp)}=${inside}. Powers: ${inside}^${e1}=${left} and ${c}^${e2}=${right}. Then ${plusMinusText(left,right,outsideOp)}=`);
}

// 4. A radical covering an entire multi-step expression.
function make4(){
  for(let tries=0;tries<200;tries++){
    const r=ri(4,12),b=ri(2,7),c=ri(2,7),prod=b*c,op=pick(['+','-']);
    const a=op==='+'?r*r-prod:r*r+prod;
    if(a<1||a>200)continue;
    return result(4,`4-${r}-${a}-${b}-${c}-${op}`,String.raw`\(\sqrt{${a}${op}(${b})(${c})}\)`,r,
      `Work inside the radical first: ${b}×${c}=${prod}, then ${plusMinusText(a,prod,op)}=${r*r}. Therefore √${r*r}=`);
  }
  return make1();
}

// 5. Large fraction involving radicals and multiple operations.
function make5(){
  for(let tries=0;tries<500;tries++){
    const denRoot=ri(2,5),q=ri(1,4),topRoot=denRoot*q;
    if(topRoot<4||topRoot>20)continue;
    const a=ri(2,Math.max(2,topRoot-1)),diff=topRoot*topRoot-a*a,pair=factorPair(diff,2,12);
    if(!pair)continue;
    const [b,c]=pair;
    return result(5,`5-${a}-${b}-${c}-${denRoot}`,String.raw`\(\frac{\sqrt{${a}^{2}+(${b})(${c})}}{\sqrt{${denRoot*denRoot}}}\)`,q,
      `In the numerator, ${a}²=${a*a} and ${b}×${c}=${b*c}, so the radicand is ${topRoot*topRoot} and the numerator is ${topRoot}. The denominator is √${denRoot*denRoot}=${denRoot}. The fraction has value`);
  }
  return make4();
}

// 6. Multi-step expression in the numerator of a fraction.
function make6(){
  for(let tries=0;tries<500;tries++){
    const a=ri(1,6),b=ri(1,6),c=ri(1,6),d=ri(c+1,c+8);
    const g1=a+b,g2=-c+d,num=g1*g1-g2*g2;
    if(num===0)continue;
    const den=smallDivisor(num); if(!den)continue;
    const ans=num/den;
    return result(6,`6-${a}-${b}-${c}-${d}-${den}`,String.raw`\(\frac{(${a}+${b})^2-(-${c}+${d})^2}{${den}}\)`,ans,
      `Parentheses: ${a}+${b}=${g1} and −${c}+${d}=${g2}. Squares: ${g1}²=${g1*g1} and ${g2}²=${g2*g2}. The numerator is ${num} and the denominator is ${den}. The fraction has value`);
  }
  return make3();
}

// 7. Power, multiplication, and a signed number in the same problem.
function make7(){
  const a=ri(2,5),e=pick([2,3,4]),b=ri(2,9),c=ri(2,9),d=ri(1,12),signed=pick([d,-d]);
  const pow=a**e,prod=b*c,ans=pow-prod+signed,st=signed<0?`(-${d})`:`(+${d})`;
  return result(7,`7-${a}-${e}-${b}-${c}-${signed}`,String.raw`\(${a}^{${e}}-(${b})(${c})+${st}\)`,ans,
    `Power and multiplication first: ${a}^${e}=${pow} and ${b}×${c}=${prod}. Then ${pow}−${prod}+(${signed})=`);
}

// 8. Fraction bar as a grouping symbol, with operations in numerator and denominator.
function make8(){
  for(let tries=0;tries<500;tries++){
    const d=ri(2,5),e=ri(1,8),den=d*d+e,q=ri(2,8),target=den*q,b=ri(2,9),c=ri(2,9),a=target-b*c;
    if(a<1||a>40)continue;
    return result(8,`8-${a}-${b}-${c}-${d}-${e}`,String.raw`\(\frac{${a}+(${b})(${c})}{${d}^{2}+${e}}\)`,q,
      `The fraction bar groups both parts. Numerator: ${b}×${c}=${b*c}, then ${a}+${b*c}=${target}. Denominator: ${d}²=${d*d}, then ${d*d}+${e}=${den}. The fraction has value`);
  }
  return make1();
}

// 9. More complicated fraction with different operations in numerator and denominator.
function make9(){
  for(let tries=0;tries<500;tries++){
    const c=ri(2,5),d=ri(2,5),den=c*d,q=ri(2,8),target=den*q,diff=ri(1,5),r=target-diff*diff;
    if(r<2||r>15)continue;
    const b=ri(1,5),a=b+diff;
    return result(9,`9-${r}-${a}-${b}-${c}-${d}`,String.raw`\(\frac{\sqrt{${r*r}}+(${a}-${b})^2}{(${c})(${d})}\)`,q,
      `Numerator: √${r*r}=${r}, ${a}−${b}=${diff}, and ${diff}²=${diff*diff}, so the numerator is ${target}. Denominator: ${c}×${d}=${den}. The fraction has value`);
  }
  return make8();
}

// 10. Product of two grouped expressions, then an outside addition/subtraction.
function make10(){
  const a=ri(4,12),b=ri(1,a-1),c=ri(1,7),d=ri(1,7),e=ri(1,15),op=pick(['+','-']);
  const g1=a-b,g2=c+d,prod=g1*g2,ans=op==='+'?prod+e:prod-e;
  return result(10,`10-${a}-${b}-${c}-${d}-${e}-${op}`,String.raw`\((${a}-${b})(${c}+${d})${op}${e}\)`,ans,
    `Parentheses first: ${a}−${b}=${g1} and ${c}+${d}=${g2}. Multiply: ${g1}×${g2}=${prod}. Then ${plusMinusText(prod,e,op)}=`);
}

// 11. Nested grouping.
function make11(){
  const m=ri(2,5),n=ri(1,8),a=ri(4,10),b=ri(1,a-1),c=ri(1,20),inside=a-b,pow=inside**2,bracket=n+pow,ans=m*bracket-c;
  return result(11,`11-${m}-${n}-${a}-${b}-${c}`,String.raw`\(${m}\left[${n}+(${a}-${b})^2\right]-${c}\)`,ans,
    `Innermost parentheses: ${a}−${b}=${inside}. Square: ${inside}²=${pow}. Brackets: ${n}+${pow}=${bracket}. Multiply: ${m}×${bracket}=${m*bracket}. Then ${m*bracket}−${c}=`);
}

// 12. A fraction that simplifies to an integer, followed by another operation.
function make12(){
  const k=ri(2,8),a=ri(4,10),b=ri(1,a-1),den=k*(a-b),q=ri(2,10),num=den*q,c=ri(2,5),e=pick([2,3]),pow=c**e;
  return result(12,`12-${k}-${a}-${b}-${q}-${c}-${e}`,String.raw`\(\frac{${num}}{${k}(${a}-${b})}+${c}^{${e}}\)`,q+pow,
    `In the denominator, ${a}−${b}=${a-b}, then ${k}×${a-b}=${den}. The fraction simplifies to ${q}. Also ${c}^${e}=${pow}. Then ${q}+${pow}=`);
}

const makers=[make1,make2,make3,make4,make5,make6,make7,make8,make9,make10,make11,make12];
function makeQuestion(){return makers[Math.floor(Math.random()*makers.length)]()}
function buildPool(totalNeeded){
  const out=[],seen=new Set();
  for(let tries=0;out.length<totalNeeded&&tries<60000;tries++){
    const q=makeQuestion();
    if(!seen.has(q.q)){seen.add(q.q);out.push(q)}
  }
  return out;
}

function showQuestion(){if(finished)return;if(idx>=pool.length)return finish("questions");const q=pool[idx];$("progress").textContent=`${idx+1} / ${pool.length}`;$("score").textContent=score;$("question").innerHTML=q.q;$("answer").value="";$("answer").disabled=false;$("checkBtn").disabled=false;resetFeedback();accepting=true;typeset([$("question")]);if(!window.BatchMathKeypad?.touchMode) $("answer").focus()}
function submit(){if(!accepting||finished)return;const raw=$("answer").value.trim();if(raw===""||!Number.isFinite(Number(raw)))return;const q=pool[idx];accepting=false;$("answer").disabled=true;$("checkBtn").disabled=true;answered++;if(Number(raw)===q.answer){score++;$("score").textContent=score;$("feedback").textContent="✓ Correct";$("feedback").className="feedback correct";advanceId=setTimeout(nextQuestion,180)}else{showExplanation(`✗ Incorrect. Correct answer: ${BatchMathDisplayMath.html(q.answer)}<br>${q.explain}`)}}
$("checkBtn").onclick=submit;$("nextBtn").onclick=nextQuestion;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(!$("nextBtn").classList.contains("hidden"))nextQuestion();else submit()}});$("startBtn").onclick=startPractice;$("againBtn").onclick=again;
</script><script data-batchmath-local-preview="1">
(function(){
  if (window.location.protocol !== 'file:') return;
  function localizeDirectoryUrl(value){
    if (!value || /^(?:[a-z][a-z0-9+.-]*:|#|\/)/i.test(value)) return value;
    var hash = '';
    var query = '';
    var hashAt = value.indexOf('#');
    if (hashAt >= 0) { hash = value.slice(hashAt); value = value.slice(0, hashAt); }
    var queryAt = value.indexOf('?');
    if (queryAt >= 0) { query = value.slice(queryAt); value = value.slice(0, queryAt); }
    if (value.endsWith('/')) value += 'index.html';
    return value + query + hash;
  }
  document.querySelectorAll('a[href]').forEach(function(link){
    link.setAttribute('href', localizeDirectoryUrl(link.getAttribute('href')));
  });
  document.querySelectorAll('option[value]').forEach(function(option){
    option.setAttribute('value', localizeDirectoryUrl(option.getAttribute('value')));
  });
})();
</script>

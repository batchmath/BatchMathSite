<header class="header"><h1>Order of Operations</h1><p>Mixed practice combining parentheses, exponents, square roots, multiplication/division, addition/subtraction, and fraction bars. No isolated exponent-only or left-to-right-only problem types.</p></header>
<section id="setupCard" class="card"><div class="settings"><div class="setting"><label for="timeSelect">Time Limit</label><select id="timeSelect"><option value="1">1 minute</option><option value="2">2 minutes</option><option value="3" selected>3 minutes</option><option value="4">4 minutes</option><option value="5">5 minutes</option></select></div><div class="setting"><label for="questionSelect">Number of Questions</label><select id="questionSelect"><option value="10">10 questions</option><option value="20" selected>20 questions</option><option value="30">30 questions</option><option value="40">40 questions</option><option value="50">50 questions</option><option value="60">60 questions</option><option value="70">70 questions</option><option value="80">80 questions</option><option value="90">90 questions</option><option value="100">100 questions</option></select></div></div><button id="startBtn" class="primary">Start Practice</button></section>

<script>const $=id=>document.getElementById(id);
let total=20,idx=0,score=0,answered=0,left=180,timerId=null,advanceId=null,pool=[],finished=false,accepting=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function timeText(){const m=Math.floor(left/60),s=left%60;$("timer").textContent=`${m}:${String(s).padStart(2,"0")}`}
function tick(){clearInterval(timerId);timeText();timerId=setInterval(()=>{left--;if(left<=0){left=0;timeText();finish("time")}else timeText()},1000)}
function typeset(nodes){if(window.MathJax&&MathJax.typesetPromise){if(MathJax.typesetClear)MathJax.typesetClear(nodes);MathJax.typesetPromise(nodes).catch(()=>{})}}
function nextQuestion(){if(finished)return;idx++;showQuestion()}
function showExplanation(html){$("feedback").innerHTML=html;$("feedback").className="feedback incorrect";$("nextBtn").classList.remove("hidden");typeset([$("feedback")]);}
function resetFeedback(){$("feedback").textContent="";$("feedback").className="feedback";$("nextBtn").classList.add("hidden")}
function finish(reason){if(finished)return;finished=true;clearInterval(timerId);clearTimeout(advanceId);$("practiceCard").classList.add("hidden");$("resultsCard").classList.remove("hidden");$("finalScore").textContent=`${score} correct`;$("finalMessage").textContent=reason==="time"?`Time is up. You answered ${answered} question${answered===1?"":"s"}.`:`You completed all ${pool.length} questions.`}
function again(){$("resultsCard").classList.add("hidden");$("setupCard").classList.remove("hidden")}

function startPractice(){clearInterval(timerId);clearTimeout(advanceId);total=Number($("questionSelect").value);left=Number($("timeSelect").value)*60;idx=0;score=0;answered=0;finished=false;pool=buildPool(total);$("setupCard").classList.add("hidden");$("resultsCard").classList.add("hidden");$("practiceCard").classList.remove("hidden");tick();showQuestion()}

function signedTerm(n){return n>=0?`+${n}`:`-${Math.abs(n)}`}
function divisors(n){const out=[];for(let d=2;d<=12;d++)if(n%d===0)out.push(d);return out}
function nonzeroDivisor(n){const ds=divisors(Math.abs(n));return ds.length?pick(ds):null}
function result(id,q,answer,steps){return{id,q,answer,explain:`${steps} <strong>${answer}</strong>.`}}

// The templates below intentionally mirror the range of structures used on the
// Unit 1 Order of Operations assignment: standalone powers/roots, products,
// fraction bars, nested parentheses, negative values, and multi-step mixtures.
function makeA(){const a=ri(2,9),b=ri(1,20),v=a**2;return result(`a-${a}-${b}`,String.raw`\(${a}^2+${b}\)`,v+b,`Exponent first: ${a}²=${v}. Then ${v}+${b}=`)}
function makeB(){const r=ri(2,20),b=ri(1,20);return result(`b-${r}-${b}`,String.raw`\(\sqrt{${r*r}}+${b}\)`,r+b,`Square root first: √${r*r}=${r}. Then ${r}+${b}=`)}
function makeC(){const a=ri(12,50),b=ri(2,9),c=ri(2,9),prod=b*c;return result(`c-${a}-${b}-${c}`,String.raw`\(${a}-(${b})(${c})\)`,a-prod,`Multiply before subtracting: ${b}×${c}=${prod}. Then ${a}−${prod}=`)}
function makeD(){const den=ri(2,10),q=ri(2,15),b=ri(1,15),num=den*q;return result(`d-${num}-${den}-${b}`,String.raw`\(\frac{${num}}{${den}}+${b}\)`,q+b,`Divide first: ${num}÷${den}=${q}. Then ${q}+${b}=`)}
function makeE(){const a=ri(1,9),b=ri(1,9),inside=a+b,v=inside**2;return result(`e-${a}-${b}`,String.raw`\((${a}+${b})^2\)`,v,`Parentheses first: ${a}+${b}=${inside}. Then square: ${inside}²=`)}
function makeF(){const r=ri(2,15),a=ri(2,6),e=pick([2,3]),pow=a**e,ans=r+pow;return result(`f-${r}-${a}-${e}`,String.raw`\(\sqrt{${r*r}}+${a}^{${e}}\)`,ans,`Evaluate the root and power first: √${r*r}=${r} and ${a}^${e}=${pow}. Then ${r}+${pow}=`)}
function makeG(){const a=ri(1,9),b=ri(1,9),c=ri(2,9),inside=a+b,prod=inside*c;return result(`g-${a}-${b}-${c}`,String.raw`\((${a}+${b})(${c})\)`,prod,`Parentheses first: ${a}+${b}=${inside}. Then ${inside}×${c}=`)}
function makeH(){const den=ri(2,10),q=ri(2,15),a=ri(q+5,q+30),num=den*q;return result(`h-${a}-${num}-${den}`,String.raw`\(${a}-\frac{${num}}{${den}}\)`,a-q,`Divide first: ${num}÷${den}=${q}. Then ${a}−${q}=`)}
function makeI(){const a=ri(1,25),b=ri(2,9),c=ri(2,9),prod=b*c;return result(`i-${a}-${b}-${c}`,String.raw`\(${a}+(${b})(${c})\)`,a+prod,`Multiply first: ${b}×${c}=${prod}. Then ${a}+${prod}=`)}
function makeJ(){const a=ri(4,12),b=ri(1,a-1),c=ri(1,25),inside=a-b,v=inside**2;return result(`j-${a}-${b}-${c}`,String.raw`\((${a}-${b})^2-${c}\)`,v-c,`Parentheses: ${a}−${b}=${inside}. Square: ${inside}²=${v}. Then ${v}−${c}=`)}
function makeK(){for(let t=0;t<100;t++){const a=ri(2,9),b=ri(2,9),den=ri(2,8),q=ri(3,15),c=den*q-a*b;if(c>=1&&c<=30){return result(`k-${a}-${b}-${c}-${den}`,String.raw`\(\frac{(${a})(${b})+${c}}{${den}}\)`,q,`The fraction bar groups the numerator. Multiply: ${a}×${b}=${a*b}. Add: ${a*b}+${c}=${den*q}. Then ${den*q}÷${den}=`)}}return makeD()}
function makeL(){const r=ri(2,15),a=ri(1,7),b=ri(1,7),inside=a+b,v=inside**2;return result(`l-${r}-${a}-${b}`,String.raw`\(\sqrt{${r*r}}+(${a}+${b})^2\)`,r+v,`Root: √${r*r}=${r}. Parentheses: ${a}+${b}=${inside}. Square: ${inside}²=${v}. Then ${r}+${v}=`)}
function makeM(){const a=ri(1,8),b=ri(1,8),c=ri(2,9),d=ri(1,25),inside=a+b,prod=inside*c;return result(`m-${a}-${b}-${c}-${d}`,String.raw`\((${a}+${b})(${c})-${d}\)`,prod-d,`Parentheses first: ${a}+${b}=${inside}. Multiply: ${inside}×${c}=${prod}. Then ${prod}−${d}=`)}
function makeN(){const b=ri(2,9),c=ri(2,9),den=pick(divisors(b*c)),q=b*c/den,a=ri(q+10,q+40);return result(`n-${a}-${b}-${c}-${den}`,String.raw`\(${a}-\frac{(${b})(${c})}{${den}}\)`,a-q,`In the fraction, multiply ${b}×${c}=${b*c}, then divide: ${b*c}÷${den}=${q}. Finally ${a}−${q}=`)}
function makeO(){const a=ri(1,8),b=ri(1,8),c=ri(1,25),inside=a+b,v=inside**2;return result(`o-${a}-${b}-${c}`,String.raw`\((${a}+${b})^2-${c}\)`,v-c,`Parentheses: ${a}+${b}=${inside}. Square: ${inside}²=${v}. Then ${v}−${c}=`)}
function makeP(){const a=ri(1,8),b=ri(1,8),c=ri(2,9),d=ri(2,9),inside=a+b,v=inside**2,prod=c*d;return result(`p-${a}-${b}-${c}-${d}`,String.raw`\((${a}+${b})^2-(${c})(${d})\)`,v-prod,`Parentheses: ${a}+${b}=${inside}. Square: ${inside}²=${v}. Multiply: ${c}×${d}=${prod}. Then ${v}−${prod}=`)}
function makeQ(){for(let t=0;t<100;t++){const a=ri(1,8),b=ri(1,8),inside=a+b,v=inside**2,den=nonzeroDivisor(v);if(!den)continue;const c=ri(1,10),q=v/den;return result(`q-${a}-${b}-${den}-${c}`,String.raw`\(\frac{(${a}+${b})^2}{${den}}+${c}\)`,q+c,`Parentheses: ${a}+${b}=${inside}. Square: ${inside}²=${v}. Divide: ${v}÷${den}=${q}. Then ${q}+${c}=`)}return makeD()}
function makeR(){const r=ri(2,15),a=ri(1,8),b=ri(1,8),c=ri(2,8),inside=a+b,prod=inside*c;return result(`r-${r}-${a}-${b}-${c}`,String.raw`\(\sqrt{${r*r}}+(${a}+${b})(${c})\)`,r+prod,`Root: √${r*r}=${r}. Parentheses: ${a}+${b}=${inside}. Multiply: ${inside}×${c}=${prod}. Then ${r}+${prod}=`)}
function makeS(){const a=ri(1,5),b=ri(1,5),c=ri(2,8),d=ri(2,8),inside=a+b,cube=inside**3,prod=c*d;return result(`s-${a}-${b}-${c}-${d}`,String.raw`\((${a}+${b})^3-(${c})(${d})\)`,cube-prod,`Parentheses: ${a}+${b}=${inside}. Cube: ${inside}³=${cube}. Multiply: ${c}×${d}=${prod}. Then ${cube}−${prod}=`)}
function makeT(){for(let t=0;t<100;t++){const a=ri(1,8),b=ri(1,8),c=ri(2,8),inside=a+b,num=inside*c,den=nonzeroDivisor(num);if(!den)continue;const d=ri(1,12),q=num/den;return result(`t-${a}-${b}-${c}-${den}-${d}`,String.raw`\(\frac{(${a}+${b})(${c})}{${den}}+${d}\)`,q+d,`Parentheses: ${a}+${b}=${inside}. Multiply: ${inside}×${c}=${num}. Divide: ${num}÷${den}=${q}. Then ${q}+${d}=`)}return makeD()}
function makeU(){for(let t=0;t<100;t++){const a=ri(5,12),b=ri(1,a-1),inside=a-b,v=inside**2,den=ri(2,8),q=ri(2,12),c=den*q-v;if(c>=1&&c<=30)return result(`u-${a}-${b}-${c}-${den}`,String.raw`\(\frac{(${a}-${b})^2+${c}}{${den}}\)`,q,`Parentheses: ${a}−${b}=${inside}. Square: ${inside}²=${v}. Add: ${v}+${c}=${den*q}. Divide by ${den}:`)}return makeK()}
function makeV(){const r=ri(5,15),a=ri(1,5),b=ri(1,5),inside=r-(a+b),v=inside**2,c=ri(1,15);return result(`v-${r}-${a}-${b}-${c}`,String.raw`\((\sqrt{${r*r}}-(${a}+${b}))^2+${c}\)`,v+c,`Inside parentheses: √${r*r}=${r} and ${a}+${b}=${a+b}, so ${r}−${a+b}=${inside}. Square: ${inside}²=${v}. Then ${v}+${c}=`)}
function makeW(){const a=ri(1,8),b=ri(1,8),c=ri(2,9),d=ri(2,9),den=pick(divisors(c*d)),inside=a+b,v=inside**2,q=c*d/den;return result(`w-${a}-${b}-${c}-${d}-${den}`,String.raw`\((${a}+${b})^2-\frac{(${c})(${d})}{${den}}\)`,v-q,`Parentheses: ${a}+${b}=${inside}. Square: ${inside}²=${v}. In the fraction, ${c}×${d}=${c*d} and ${c*d}÷${den}=${q}. Then ${v}−${q}=`)}
function makeX(){for(let t=0;t<100;t++){const a=ri(7,15),r=ri(2,6);if(a<=r)continue;const s=ri(2,10),left=(a-r)**2,num=left+s,den=nonzeroDivisor(num);if(!den)continue;const q=num/den;return result(`x-${a}-${r}-${s}-${den}`,String.raw`\(\frac{(${a}-\sqrt{${r*r}})^2+\sqrt{${s*s}}}{${den}}\)`,q,`Root and parentheses first: √${r*r}=${r}, so ${a}−${r}=${a-r}; square to get ${left}. Also √${s*s}=${s}. Numerator: ${left}+${s}=${num}. Divide by ${den}:`)}return makeV()}
function makeY(){const a=ri(1,8),b=ri(1,8),c=ri(4,10),d=ri(1,c-1),u=a+b,v=c-d,p1=u**2,p2=v**2;return result(`y-${a}-${b}-${c}-${d}`,String.raw`\((${a}+${b})^2+(${c}-${d})^2\)`,p1+p2,`Parentheses: ${a}+${b}=${u} and ${c}−${d}=${v}. Squares: ${u}²=${p1} and ${v}²=${p2}. Add: ${p1}+${p2}=`)}
function makeZ(){for(let t=0;t<100;t++){const a=ri(1,8),b=ri(1,8),inside=a+b,v=inside**2,c=ri(1,Math.min(v-1,25)),num=v-c,den=nonzeroDivisor(num);if(!den)continue;return result(`z-${a}-${b}-${c}-${den}`,String.raw`\(\frac{(${a}+${b})^2-${c}}{${den}}\)`,num/den,`Parentheses: ${a}+${b}=${inside}. Square: ${inside}²=${v}. Numerator: ${v}−${c}=${num}. Divide by ${den}:`)}return makeQ()}
function makeAA(){const r=ri(4,12),a=ri(1,6),b=ri(2,8),c=ri(2,8),inside=r+a,v=inside**2,prod=b*c;return result(`aa-${r}-${a}-${b}-${c}`,String.raw`\((\sqrt{${r*r}}+${a})^2-(${b})(${c})\)`,v-prod,`Root: √${r*r}=${r}. Parentheses: ${r}+${a}=${inside}. Square: ${inside}²=${v}. Multiply: ${b}×${c}=${prod}. Then ${v}−${prod}=`)}
function makeAB(){const a=ri(1,7),b=ri(a+1,a+9),r=ri(2,10),inside=-a+b,v=inside**2;return result(`ab-${a}-${b}-${r}`,String.raw`\((-${a}+${b})^2-\sqrt{${r*r}}\)`,v-r,`Parentheses: −${a}+${b}=${inside}. Square: ${inside}²=${v}. Root: √${r*r}=${r}. Then ${v}−${r}=`)}
function makeAC(){const a=ri(2,8),b=ri(2,8),c=ri(2,8),v=a**2,prod=(-b)*c;return result(`ac-${a}-${b}-${c}`,String.raw`\((-${a})^2+(-${b})(${c})\)`,v+prod,`Square the negative number in parentheses: (−${a})²=${v}. Multiply: −${b}×${c}=${prod}. Then ${v}${prod>=0?'+':'−'}${Math.abs(prod)}=`)}
function makeAD(){const a=ri(1,8),b=ri(1,8),c=ri(2,8),d=ri(2,8),r=ri(2,10),inside=a+b,v=inside**2,group=c*d-r;return result(`ad-${a}-${b}-${c}-${d}-${r}`,String.raw`\((${a}+${b})^2-((${c})(${d})-\sqrt{${r*r}})\)`,v-group,`First group: ${a}+${b}=${inside}, so ${inside}²=${v}. In the second parentheses, ${c}×${d}=${c*d} and √${r*r}=${r}, so ${c*d}−${r}=${group}. Then ${v}−${group}=`)}
function makeAE(){for(let t=0;t<100;t++){const a=ri(1,6),b=ri(a+2,a+10),c=ri(2,8),d=ri(2,8),inside=-a+b,v=inside**2,num=v+c*d,den=nonzeroDivisor(num);if(!den)continue;return result(`ae-${a}-${b}-${c}-${d}-${den}`,String.raw`\(\frac{(-${a}+${b})^2+(${c})(${d})}{${den}}\)`,num/den,`Parentheses: −${a}+${b}=${inside}. Square: ${inside}²=${v}. Multiply: ${c}×${d}=${c*d}. Numerator: ${v}+${c*d}=${num}. Divide by ${den}:`)}return makeZ()}

function makeAF(){const a=ri(5,25),b=ri(2,9),c=ri(2,9),d=ri(2,6),pow=d**2,prod=b*c;return result(`af-${a}-${b}-${c}-${d}`,String.raw`\(${a}+(${b})(${c})-${d}^2\)`,a+prod-pow,`Multiply and exponent before addition/subtraction: ${b}×${c}=${prod} and ${d}²=${pow}. Then ${a}+${prod}−${pow}=`)}
function makeAG(){const den=ri(2,9),q=ri(2,12),a=den*q,c=ri(2,8),d=ri(2,8),r=ri(2,12);const prod=c*d;return result(`ag-${a}-${den}-${c}-${d}-${r}`,String.raw`\(\frac{${a}}{${den}}+(${c})(${d})-\sqrt{${r*r}}\)`,q+prod-r,`Do division, multiplication, and the root first: ${a}÷${den}=${q}, ${c}×${d}=${prod}, √${r*r}=${r}. Then ${q}+${prod}−${r}=`)}
function makeAH(){const den=ri(2,9),q=ri(2,12),num=den*q,a=ri(q+10,q+40),c=ri(2,8),d=ri(2,8);return result(`ah-${a}-${num}-${den}-${c}-${d}`,String.raw`\(${a}-\frac{${num}}{${den}}+(${c})(${d})\)`,a-q+c*d,`Divide and multiply first: ${num}÷${den}=${q} and ${c}×${d}=${c*d}. Then work left to right: ${a}−${q}+${c*d}=`)}
function makeAI(){const a=ri(2,8),b=ri(2,8),c=ri(2,8),d=ri(2,8),r=ri(2,12);const p1=a*b,p2=c*d;return result(`ai-${a}-${b}-${c}-${d}-${r}`,String.raw`\((${a})(${b})-(${c})(${d})+\sqrt{${r*r}}\)`,p1-p2+r,`Multiply and take the root first: ${a}×${b}=${p1}, ${c}×${d}=${p2}, and √${r*r}=${r}. Then ${p1}−${p2}+${r}=`)}
function makeAJ(){const a=ri(1,8),b=ri(1,8),c=ri(2,6),d=ri(2,8),inside=a+b,pow=c**2;return result(`aj-${a}-${b}-${c}-${d}`,String.raw`\((${a}+${b})(${d})-${c}^2\)`,inside*d-pow,`Parentheses first: ${a}+${b}=${inside}. Then multiply ${inside}×${d}=${inside*d} and evaluate ${c}²=${pow}. Subtract: ${inside*d}−${pow}=`)}
function makeAK(){for(let tries=0;tries<150;tries++){const a=ri(2,8),b=ri(2,8),c=ri(1,12),d=ri(2,8),e=ri(2,8);const num=a*b+c,den=pick(divisors(num));if(!den)continue;const q=num/den;return result(`ak-${a}-${b}-${c}-${den}-${d}-${e}`,String.raw`\(\frac{(${a})(${b})+${c}}{${den}}+(${d})(${e})\)`,q+d*e,`The fraction bar groups its numerator: ${a}×${b}=${a*b}, then ${a*b}+${c}=${num}, then ${num}÷${den}=${q}. Also ${d}×${e}=${d*e}. Add: ${q}+${d*e}=`)}return makeK()}
function makeAL(){const a=ri(1,6),b=ri(1,6),e=pick([2,3]),r=ri(2,10),d=ri(1,12),inside=a+b,pow=inside**e;return result(`al-${a}-${b}-${e}-${r}-${d}`,String.raw`\((${a}+${b})^${e}-\sqrt{${r*r}}+${d}\)`,pow-r+d,`Parentheses first: ${a}+${b}=${inside}. Evaluate the power and root next: ${inside}^${e}=${pow} and √${r*r}=${r}. Then finish left to right: ${pow}−${r}+${d}=`)}
function makeAM(){for(let tries=0;tries<150;tries++){const a=ri(4,10),b=ri(1,a-1),c=ri(2,8),d=ri(2,8),inside=a-b,pow=inside**2,num=pow+c*d,den=pick(divisors(num));if(!den)continue;return result(`am-${a}-${b}-${c}-${d}-${den}`,String.raw`\(\frac{(${a}-${b})^2+(${c})(${d})}{${den}}\)`,num/den,`The fraction bar groups the whole numerator. Parentheses: ${a}−${b}=${inside}; square: ${inside}²=${pow}; multiply: ${c}×${d}=${c*d}. Numerator ${pow}+${c*d}=${num}; divide by ${den}:`)}return makeAE()}

const makers=[makeA,makeB,makeC,makeD,makeE,makeF,makeG,makeH,makeI,makeJ,makeK,makeL,makeM,makeN,makeO,makeP,makeQ,makeR,makeS,makeT,makeU,makeV,makeW,makeX,makeY,makeZ,makeAA,makeAB,makeAC,makeAD,makeAE,makeAF,makeAG,makeAH,makeAI,makeAJ,makeAK,makeAL,makeAM];
function makeQuestion(){return pick(makers)()}
function buildPool(totalNeeded){const out=[],seen=new Set();for(let tries=0;out.length<totalNeeded&&tries<50000;tries++){const q=makeQuestion();if(!seen.has(q.q)){seen.add(q.q);out.push(q)}}return out}


function showQuestion(){if(finished)return;if(idx>=pool.length)return finish("questions");const q=pool[idx];$("progress").textContent=`${idx+1} / ${pool.length}`;$("score").textContent=score;$("question").innerHTML=q.q;$("answer").value="";$("answer").disabled=false;$("checkBtn").disabled=false;resetFeedback();accepting=true;typeset([$("question")]);if(!window.BatchMathKeypad?.touchMode) $("answer").focus()}
function submit(){if(!accepting||finished)return;const raw=$("answer").value.trim();if(raw===""||!Number.isFinite(Number(raw)))return;const q=pool[idx];accepting=false;$("answer").disabled=true;$("checkBtn").disabled=true;answered++;if(Number(raw)===q.answer){score++;$("score").textContent=score;$("feedback").textContent="✓ Correct";$("feedback").className="feedback correct";advanceId=setTimeout(nextQuestion,180)}else{showExplanation(`✗ Incorrect. Correct answer: <strong>${q.answer}</strong><br>${q.explain}`)}}
$("checkBtn").onclick=submit;$("nextBtn").onclick=nextQuestion;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(!$("nextBtn").classList.contains("hidden"))nextQuestion();else submit()}});$("startBtn").onclick=startPractice;$("againBtn").onclick=again;
</script><script data-batchmath-local-preview="1">
(function(){
  if (window.location.protocol !== 'file:') return;
  function localizeDirectoryUrl(value){
    if (!value || /^(?:[a-z][a-z0-9+.-]*:|#|\/)/i.test(value)) return value;
    var hash = '';
    var query = '';
    var hashAt = value.indexOf('#');
    if (hashAt >= 0) { hash = value.slice(hashAt); value = value.slice(0, hashAt); }
    var queryAt = value.indexOf('?');
    if (queryAt >= 0) { query = value.slice(queryAt); value = value.slice(0, queryAt); }
    if (value.endsWith('/')) value += 'index.html';
    return value + query + hash;
  }
  document.querySelectorAll('a[href]').forEach(function(link){
    link.setAttribute('href', localizeDirectoryUrl(link.getAttribute('href')));
  });
  document.querySelectorAll('option[value]').forEach(function(option){
    option.setAttribute('value', localizeDirectoryUrl(option.getAttribute('value')));
  });
})();
</script>

<style>*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#030303;color:#f4f4f4}
.page{max-width:900px;margin:0 auto;padding:28px 20px 46px}
.back{display:inline-block;color:#f5c400;text-decoration:none;font-weight:800;margin-bottom:16px}
.header{text-align:center;margin:18px 0 22px}.header h1{margin:0;color:#d71920;font-size:2.1rem}.header p{max-width:680px;margin:10px auto 0;color:#bdbdbd;line-height:1.45}
.card{background:#090909;border:1px solid #292929;border-radius:14px;padding:26px;margin-bottom:18px}.hidden{display:none!important}
.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:780px;margin:0 auto}.setting label{display:block;color:#f5c400;font-weight:800;margin-bottom:8px}
select,#answer{width:100%;padding:12px 13px;border:2px solid #363636;border-radius:9px;background:#111;color:#fff;font-size:1rem}
button{border:0;border-radius:9px;padding:12px 19px;font-size:1rem;font-weight:800;cursor:pointer}.primary,.check{background:#d71920;color:#fff}.primary{display:block;margin:22px auto 0}.check{display:block;margin:14px auto 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}.stat{text-align:center;background:#121212;color:#f5c400;border-radius:9px;padding:11px;font-weight:800}.stat span{display:block;margin-top:3px;font-size:1.3rem}
.question-area{text-align:center}.question{margin:16px 0 24px;color:#f5c400;font-size:clamp(2.2rem,6vw,4rem);font-weight:900;line-height:1.25}.question.word{font-size:clamp(1.3rem,3.5vw,2rem);line-height:1.45;max-width:760px;margin-left:auto;margin-right:auto}
#answer{display:block;width:min(320px,100%);margin:0 auto;text-align:center;font-size:1.8rem}.feedback{min-height:62px;margin-top:16px;font-size:1.08rem;font-weight:800;line-height:1.4}.correct{color:#f5c400}.incorrect{color:#ff4b50}.results{text-align:center}.big-score{font-size:3.4rem;font-weight:900;color:#f5c400}.results p{color:#aaa}.instruction{max-width:720px;margin:0 auto 18px;color:#c8c8c8;line-height:1.45;text-align:center}
.choice-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;max-width:760px;margin:0 auto}.choice{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 7px;border:1px solid #333;border-radius:9px;background:#111;font-weight:800;cursor:pointer}.choice input{width:18px;height:18px;accent-color:#d71920}
@media(max-width:720px){.settings{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr 1fr}.card{padding:20px 15px}}</style><link rel="stylesheet" href="../../../../../assets/im1-keypad.css"><script defer src="../../../../../assets/im1-keypad.js"></script></head><body><main class="page"><a class="back" href="../../../">← Unit 1 - Review</a>
<header class="header"><h1>Integer Multiplication &amp; Division</h1><p>Practice the sign rules for multiplying and dividing positive and negative integers. Division problems always have exact integer answers.</p></header>
<section id="setupCard" class="card"><div class="settings">
<div class="setting"><label for="categorySelect">Practice Type</label><select id="categorySelect"><option value="mixed" selected>Mixed Multiplication &amp; Division</option><option value="multiply">Multiplication Only</option><option value="divide">Division Only</option></select></div>
<div class="setting"><label for="timeSelect">Time Limit</label><select id="timeSelect"><option value="1">1 minute</option><option value="2">2 minutes</option><option value="3" selected>3 minutes</option><option value="4">4 minutes</option><option value="5">5 minutes</option></select></div>
<div class="setting"><label for="questionSelect">Number of Questions</label><select id="questionSelect"><option value="10">10 questions</option><option value="20" selected>20 questions</option><option value="30">30 questions</option><option value="40">40 questions</option><option value="50">50 questions</option><option value="60">60 questions</option><option value="70">70 questions</option><option value="80">80 questions</option><option value="90">90 questions</option><option value="100">100 questions</option></select></div>
</div><button id="startBtn" class="primary">Start Practice</button></section>
<section id="practiceCard" class="card hidden"><div class="stats"><div class="stat">Question<span id="progress"></span></div><div class="stat">Score<span id="score">0</span></div><div class="stat">Time<span id="timer"></span></div></div>
<div class="question-area"><div id="question" class="question"></div><input id="answer" type="text" autocomplete="off" aria-label="Answer" data-bm-keypad="integer"><button id="checkBtn" class="check">Check Answer</button><div id="feedback" class="feedback" aria-live="polite"></div></div></section>
<section id="resultsCard" class="card results hidden"><h2>Practice Complete</h2><div id="finalScore" class="big-score"></div><p id="finalMessage"></p><button id="againBtn" class="primary">Practice Again</button></section></main>
<script>const $=id=>document.getElementById(id);
let total=20,idx=0,score=0,answered=0,left=180,timerId=null,advanceId=null,pool=[],finished=false,accepting=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function timeText(){const m=Math.floor(left/60),s=left%60;$("timer").textContent=`${m}:${String(s).padStart(2,"0")}`}
function tick(){clearInterval(timerId);timeText();timerId=setInterval(()=>{left--;if(left<=0){left=0;timeText();finish("time")}else timeText()},1000)}
function typeset(nodes){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise(nodes).catch(()=>{})}
function nextQuestion(){if(finished)return;idx++;showQuestion()}
function startPractice(){clearInterval(timerId);clearTimeout(advanceId);total=Number($("questionSelect").value);left=Number($("timeSelect").value)*60;idx=0;score=0;answered=0;finished=false;pool=buildPool($("categorySelect").value,total);$("setupCard").classList.add("hidden");$("resultsCard").classList.add("hidden");$("practiceCard").classList.remove("hidden");tick();showQuestion()}
function finish(reason){if(finished)return;finished=true;clearInterval(timerId);clearTimeout(advanceId);$("practiceCard").classList.add("hidden");$("resultsCard").classList.remove("hidden");$("finalScore").textContent=`${score} correct`;$("finalMessage").textContent=reason==="time"?`Time is up. You answered ${answered} question${answered===1?"":"s"}.`:`You completed all ${pool.length} questions.`}
function again(){$("resultsCard").classList.add("hidden");$("setupCard").classList.remove("hidden")}
/* ENGINE CORE START */

function fmtInt(n){return n<0?`(${n})`:`(${n})`}
function buildPool(category,totalNeeded){
 const all=[];
 for(let a=2;a<=12;a++)for(let b=2;b<=12;b++)for(const sa of [-1,1])for(const sb of [-1,1]){
   const x=sa*a,y=sb*b;
   all.push({id:`m-${x}-${y}`,q:`${fmtInt(x)}${fmtInt(y)} = ?`,answer:x*y,kind:"multiply"});
 }
 for(let q=2;q<=12;q++)for(let d=2;d<=12;d++)for(const sq of [-1,1])for(const sd of [-1,1]){
   const quotient=sq*q,divisor=sd*d,dividend=quotient*divisor;
   all.push({id:`d-${dividend}-${divisor}`,q:`${dividend} ÷ ${divisor<0?`(${divisor})`:divisor} = ?`,answer:quotient,kind:"divide"});
 }
 let use=all;
 if(category==="multiply")use=all.filter(x=>x.kind==="multiply");
 if(category==="divide")use=all.filter(x=>x.kind==="divide");
 return shuffle(use).slice(0,totalNeeded);
}

/* ENGINE CORE END */

function showQuestion(){if(finished)return;if(idx>=pool.length)return finish("questions");const q=pool[idx];$("progress").textContent=`${idx+1} / ${pool.length}`;$("score").textContent=score;$("question").className="question";$("question").textContent=q.q;$("answer").value="";$("answer").disabled=false;$("checkBtn").disabled=false;$("feedback").textContent="";$("feedback").className="feedback";accepting=true;if(!window.BatchMathKeypad?.touchMode) $("answer").focus()}
function submit(){if(!accepting||finished)return;const raw=$("answer").value.trim();if(raw==="")return;const q=pool[idx];accepting=false;$("answer").disabled=true;$("checkBtn").disabled=true;answered++;const ok=Number(raw)===q.answer;if(ok){score++;$("score").textContent=score;$("feedback").textContent="✓ Correct";$("feedback").className="feedback correct";advanceId=setTimeout(nextQuestion,180)}else{$("feedback").textContent=`✗ Incorrect. Correct answer: ${q.answer}`;$("feedback").className="feedback incorrect";advanceId=setTimeout(nextQuestion,2000)}}
$("checkBtn").onclick=submit;$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});

$("startBtn").onclick=startPractice;$("againBtn").onclick=again;
</script><script data-batchmath-local-preview="1">
(function(){
  if (window.location.protocol !== 'file:') return;
  function localizeDirectoryUrl(value){
    if (!value || /^(?:[a-z][a-z0-9+.-]*:|#|\/)/i.test(value)) return value;
    var hash = '';
    var query = '';
    var hashAt = value.indexOf('#');
    if (hashAt >= 0) { hash = value.slice(hashAt); value = value.slice(0, hashAt); }
    var queryAt = value.indexOf('?');
    if (queryAt >= 0) { query = value.slice(queryAt); value = value.slice(0, queryAt); }
    if (value.endsWith('/')) value += 'index.html';
    return value + query + hash;
  }
  document.querySelectorAll('a[href]').forEach(function(link){
    link.setAttribute('href', localizeDirectoryUrl(link.getAttribute('href')));
  });
  document.querySelectorAll('option[value]').forEach(function(option){
    option.setAttribute('value', localizeDirectoryUrl(option.getAttribute('value')));
  });
})();
</script>
</body></html>

<script>
const $ = id => document.getElementById(id);

let total = 20;
let idx = 0;
let score = 0;
let answered = 0;
let left = 180;
let timerId = null;
let advanceId = null;
let pool = [];
let finished = false;
let accepting = false;

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function superscript(n){
  const map = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
  return String(n).split("").map(d=>map[d]).join("");
}

function addQuestion(list, text, answer, key, explain){
  list.push({text, answer, key, explain});
}

function buildPool(){
  const radicals = [];
  const exponents = [];

  for(let n=1;n<=20;n++){
    addQuestion(radicals, `\\(\\sqrt{${n*n}} = ?\\)`, n, `sqrt-${n*n}`, `A square root asks what positive number times itself gives ${n*n}. Since ${n}×${n}=${n*n}, the answer is <strong>${n}</strong>.`);
  }

  for(let base=2;base<=20;base++){
    addQuestion(exponents, `\\(${base}^{2} = ?\\)`, base**2, `pow-${base}-2`, `${base}^2 means multiply ${base} by itself 2 times. The value is <strong>${base**2}</strong>.`);
  }

  for(let base=30;base<=100;base+=10){
    addQuestion(exponents, `\\(${base}^{2} = ?\\)`, base**2, `pow-${base}-2`, `${base}^2 means multiply ${base} by itself 2 times. The value is <strong>${base**2}</strong>.`);
  }

  for(let base=2;base<=10;base++){
    addQuestion(exponents, `\\(${base}^{3} = ?\\)`, base**3, `pow-${base}-3`, `${base}^3 means multiply ${base} by itself 3 times. The value is <strong>${base**3}</strong>.`);
  }

  for(let base=2;base<=5;base++){
    addQuestion(exponents, `\\(${base}^{4} = ?\\)`, base**4, `pow-${base}-4`, `${base}^4 means multiply ${base} by itself 4 times. The value is <strong>${base**4}</strong>.`);
  }

  for(let base=2;base<=3;base++){
    addQuestion(exponents, `\\(${base}^{5} = ?\\)`, base**5, `pow-${base}-5`, `${base}^5 means multiply ${base} by itself 5 times. The value is <strong>${base**5}</strong>.`);
  }

  for(let base=2;base<=3;base++){
    addQuestion(exponents, `\\(${base}^{6} = ?\\)`, base**6, `pow-${base}-6`, `${base}^6 means multiply ${base} by itself 6 times. The value is <strong>${base**6}</strong>.`);
  }

  for(let exp=2;exp<=10;exp++){
    addQuestion(exponents, `\\(2^{${exp}} = ?\\)`, 2**exp, `pow-2-${exp}`, `2^${exp} means multiply ${Array(exp).fill(2).join(" × ")}. The value is <strong>${2**exp}</strong>.`);
  }

  function uniqueByKey(items){
    const seen = new Set();
    return items.filter(q=>{
      if(seen.has(q.key)) return false;
      seen.add(q.key);
      return true;
    });
  }

  const radicalUnique = uniqueByKey(radicals);
  const exponentUnique = uniqueByKey(exponents);
  const result = [];

  while(result.length < total){
    const remaining = total - result.length;
    const cycle = [];
    const cycleUsed = new Set();
    const rs = shuffle([...radicalUnique]);
    const es = shuffle([...exponentUnique]);

    const radicalTarget = Math.min(rs.length, Math.round(remaining * 0.40));
    const exponentTarget = Math.min(es.length, remaining - radicalTarget);

    function take(source,count){
      for(const q of source){
        if(cycle.length >= remaining || count <= 0) break;
        if(!cycleUsed.has(q.key)){
          cycleUsed.add(q.key);
          cycle.push(q);
          count--;
        }
      }
    }

    take(rs, radicalTarget);
    take(es, exponentTarget);

    const leftovers = shuffle([...rs, ...es]);
    for(const q of leftovers){
      if(cycle.length >= remaining) break;
      if(!cycleUsed.has(q.key)){
        cycleUsed.add(q.key);
        cycle.push(q);
      }
    }

    shuffle(cycle);

    if(result.length && cycle.length > 1 && result[result.length-1].key === cycle[0].key){
      const swapIndex = cycle.findIndex((q,i)=>i>0 && q.key !== result[result.length-1].key);
      if(swapIndex > 0){
        [cycle[0],cycle[swapIndex]] = [cycle[swapIndex],cycle[0]];
      }
    }

    result.push(...cycle);
    if(cycle.length===0) break;
  }

  return result.slice(0,total).map(q=>{
    if(q.explain) return q;
    if(q.key.startsWith("pow-")){const parts=q.key.split("-"),base=Number(parts[1]),exp=Number(parts[2]);q.explain=`${base}^${exp} means multiply ${base} by itself ${exp} times. The value is <strong>${q.answer}</strong>.`;}
    if(q.key.startsWith("sqrt-")){const rad=Number(q.key.split("-")[1]);q.explain=`A square root asks what positive number times itself gives ${rad}. The answer is <strong>${q.answer}</strong>.`;}
    return q;
  });
}

function timeText(){
  const m=Math.floor(left/60);
  const s=left%60;
  $("timer").textContent=`${m}:${String(s).padStart(2,"0")}`;
}

function startTimer(){
  clearInterval(timerId);
  timeText();

  timerId=setInterval(()=>{
    left--;
    if(left<=0){
      left=0;
      timeText();
      finish("time");
      return;
    }
    timeText();
  },1000);
}

function show(){
  if(finished) return;

  if(idx>=pool.length){
    finish("questions");
    return;
  }

  const q=pool[idx];

  $("progress").textContent=`${idx+1} / ${pool.length}`;
  $("score").textContent=score;
  $("question").textContent=q.text;
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetClear([$("question")]);
    MathJax.typesetPromise([$("question")]);
  }
  $("answer").value="";
  $("answer").disabled=false;
  $("checkBtn").disabled=false;
  $("feedback").textContent="";
  $("feedback").className="feedback";
  $("nextBtn").classList.add("hidden");
  accepting=true;
  if(!window.BatchMathKeypad?.touchMode) $("answer").focus();
}

function next(){
  if(finished) return;
  idx++;
  show();
}

function submit(){
  if(!accepting || finished) return;

  const raw=$("answer").value.trim();
  if(raw==="") return;

  accepting=false;
  $("answer").disabled=true;
  $("checkBtn").disabled=true;
  answered++;

  const q=pool[idx];
  const ok=Number(raw)===q.answer;

  clearTimeout(advanceId);

  if(ok){
    score++;
    $("score").textContent=score;
    $("feedback").textContent="✓ Correct";
    $("feedback").className="feedback correct";
    advanceId=setTimeout(next,180);
  }else{
    $("feedback").innerHTML=`✗ Incorrect. Correct answer: ${BatchMathDisplayMath.html(q.answer)}<br>${q.explain}`;
    $("feedback").className="feedback incorrect";
    BatchMathDisplayMath.typeset([$("feedback")]);
    $("nextBtn").classList.remove("hidden");
    ;
  }
}

function start(){
  clearInterval(timerId);
  clearTimeout(advanceId);

  total=Number($("questionSelect").value);
  left=Number($("timeSelect").value)*60;
  idx=0;
  score=0;
  answered=0;
  finished=false;
  accepting=false;

  pool=buildPool();

  $("setupCard").classList.add("hidden");
  $("resultsCard").classList.add("hidden");
  $("practiceCard").classList.remove("hidden");

  startTimer();
  show();
}

function finish(reason){
  if(finished) return;

  finished=true;
  accepting=false;
  clearInterval(timerId);
  clearTimeout(advanceId);

  $("practiceCard").classList.add("hidden");
  $("resultsCard").classList.remove("hidden");

  $("finalScore").textContent=`${score} correct`;

  if(reason==="time"){
    $("finalMessage").textContent=`Time is up. You answered ${answered} question${answered===1?"":"s"}.`;
  }else{
    $("finalMessage").textContent=`You completed all ${pool.length} questions.`;
  }
}

function reset(){
  clearInterval(timerId);
  clearTimeout(advanceId);
  $("resultsCard").classList.add("hidden");
  $("practiceCard").classList.add("hidden");
  $("setupCard").classList.remove("hidden");
}

$("startBtn").addEventListener("click",start);
$("checkBtn").addEventListener("click",submit);
$("nextBtn").addEventListener("click",next);
$("againBtn").addEventListener("click",reset);
$("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    if(!$("nextBtn").classList.contains("hidden")) next(); else submit();
  }
});
</script>
<script data-batchmath-local-preview="1">
(function(){
  if (window.location.protocol !== 'file:') return;
  function localizeDirectoryUrl(value){
    if (!value || /^(?:[a-z][a-z0-9+.-]*:|#|\/)/i.test(value)) return value;
    var hash = '';
    var query = '';
    var hashAt = value.indexOf('#');
    if (hashAt >= 0) { hash = value.slice(hashAt); value = value.slice(0, hashAt); }
    var queryAt = value.indexOf('?');
    if (queryAt >= 0) { query = value.slice(queryAt); value = value.slice(0, queryAt); }
    if (value.endsWith('/')) value += 'index.html';
    return value + query + hash;
  }
  document.querySelectorAll('a[href]').forEach(function(link){
    link.setAttribute('href', localizeDirectoryUrl(link.getAttribute('href')));
  });
  document.querySelectorAll('option[value]').forEach(function(option){
    option.setAttribute('value', localizeDirectoryUrl(option.getAttribute('value')));
  });
})();
</script>

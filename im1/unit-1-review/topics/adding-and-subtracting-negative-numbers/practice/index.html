<script>
const $=id=>document.getElementById(id);let total=20,idx=0,score=0,answered=0,left=180,timerId,advanceId,pool=[],finished=false,accepting=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(n){return n<0?`(${n})`:`${n}`}
function build(){
  let a=[];

  for(let x=-20;x<=20;x++){
    for(let y=-20;y<=20;y++){
      // Zero should never appear as either operand.
      if(x===0 || y===0) continue;

      for(const op of ["+","-"]){
        let r=op==="+" ? x+y : x-y;

        // Keep answers between -20 and 20.
        if(r < -20 || r > 20) continue;

        // Positive + positive is never used.
        // Excluded: 8 + 4
        if(op==="+" && x>0 && y>0) continue;

        // Positive - positive is only used when subtracting
        // a larger positive number, so the result is negative.
        // Allowed: 4 - 9
        // Excluded: 9 - 4, 8 - 8
        if(op==="-" && x>0 && y>0 && y<=x) continue;

        // Positive first numbers ARE allowed when:
        //  - adding a negative:      8 + (-3)
        //  - subtracting a negative: 8 - (-3)
        //  - subtracting a larger positive: 4 - 9
        //
        // Negative first numbers may add or subtract either
        // positive or negative nonzero numbers.

        const explain=op==="-"
          ? `Rewrite subtraction as addition of the opposite: ${fmt(x)} − ${fmt(y)} = ${fmt(x)} + ${fmt(-y)}. Then combine the integers to get <strong>${r}</strong>.`
          : ((x<0)===(y<0)
              ? `The integers have the same sign. Add their absolute values and keep that sign: <strong>${r}</strong>.`
              : `The integers have different signs. Subtract the smaller absolute value from the larger and use the sign of the number with the larger absolute value: <strong>${r}</strong>.`);
        a.push({text:`${fmt(x)} ${op} ${fmt(y)} = ?`,answer:r,explain});
      }
    }
  }

  return shuffle(a).slice(0,total);
}
function time(){let m=Math.floor(left/60),s=left%60;$("timer").textContent=`${m}:${String(s).padStart(2,"0")}`}
function tick(){clearInterval(timerId);time();timerId=setInterval(()=>{left--;if(left<=0){left=0;time();finish("time")}else time()},1000)}
function show(){if(finished)return;if(idx>=pool.length)return finish("questions");let q=pool[idx];$("progress").textContent=`${idx+1} / ${pool.length}`;$("score").textContent=score;BatchMathDisplayMath.set($("question"),q.text);$("answer").value="";$("answer").disabled=false;$("checkBtn").disabled=false;$("feedback").textContent="";$("feedback").className="feedback";$("nextBtn").classList.add("hidden");accepting=true;if(!window.BatchMathKeypad?.touchMode) $("answer").focus()}
function next(){if(finished)return;idx++;show()}
function submit(){if(!accepting||finished)return;let raw=$("answer").value.trim();if(raw==="")return;accepting=false;$("answer").disabled=true;$("checkBtn").disabled=true;answered++;let q=pool[idx],ok=Number(raw)===q.answer;if(ok){score++;$("score").textContent=score;$("feedback").textContent="✓ Correct";$("feedback").className="feedback correct";advanceId=setTimeout(next,180)}else{$("feedback").innerHTML=`✗ Incorrect. Correct answer: ${BatchMathDisplayMath.html(q.answer)}<br>${q.explain}`;$("feedback").className="feedback incorrect";BatchMathDisplayMath.typeset([$("feedback")]);$("nextBtn").classList.remove("hidden");}}
function start(){clearInterval(timerId);clearTimeout(advanceId);total=Number($("questionSelect").value);left=Number($("timeSelect").value)*60;idx=0;score=0;answered=0;finished=false;pool=build();$("setupCard").classList.add("hidden");$("resultsCard").classList.add("hidden");$("practiceCard").classList.remove("hidden");tick();show()}
function finish(reason){if(finished)return;finished=true;clearInterval(timerId);clearTimeout(advanceId);$("practiceCard").classList.add("hidden");$("resultsCard").classList.remove("hidden");$("finalScore").textContent=`${score} correct`;$("finalMessage").textContent=reason==="time"?`Time is up. You answered ${answered} question${answered===1?"":"s"}.`:`You completed all ${pool.length} questions.`}
$("startBtn").onclick=start;$("checkBtn").onclick=submit;$("nextBtn").onclick=next;$("againBtn").onclick=()=>{$("resultsCard").classList.add("hidden");$("setupCard").classList.remove("hidden")};$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(!$("nextBtn").classList.contains("hidden"))next();else submit()}});
</script><script data-batchmath-local-preview="1">

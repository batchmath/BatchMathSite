<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Free math instruction, interactive practice, videos, worksheets, notes, and resources for AP Calculus AB and Integrated Math 1 from BatchMath.">
<link rel="canonical" href="https://batchmath.net/">
<meta property="og:site_name" content="BatchMath">
<meta property="og:type" content="website">
<meta property="og:title" content="BatchMath | AP Calculus AB &amp; Integrated Math 1 Resources">
<meta property="og:description" content="Free math instruction, interactive practice, videos, worksheets, notes, and resources for AP Calculus AB and Integrated Math 1 from BatchMath.">
<meta property="og:url" content="https://batchmath.net/">
<title>BatchMath | AP Calculus AB &amp; Integrated Math 1 Resources</title>
<style>
:root{
  --black:#030303;
  --panel:#080808;
  --panel2:#101010;
  --red:#d71920;
  --red-dark:#9e1116;
  --yellow:#f5c400;
  --yellow-soft:#ffd93d;
  --white:#f4f4f4;
  --gray:#9a9a9a;
  --border:#292929;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}
a{color:inherit}
.site-shell{
  min-height:100vh;
  position:relative;
  overflow:hidden;
}
.topbar{
  min-height:82px;
  border-bottom:1px solid #181818;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px 170px;
  position:relative;
}
.logo{
  color:var(--red);
  text-decoration:none;
  font-weight:900;
  font-size:clamp(2rem,5vw,4rem);
  line-height:1;
  letter-spacing:-.05em;
  text-align:center;
}
.corner-person{
  position:absolute;
  width:118px;
  height:145px;
  object-fit:cover;
  object-position:50% 20%;
  border-radius:10px;
  filter:saturate(1.02) contrast(1.03);
  user-select:none;
  pointer-events:none;
}
.corner-person.top-left{left:18px;top:10px}
.profile-area{
  position:absolute;
  right:18px;
  top:8px;
  width:126px;
  z-index:50;
  text-align:center;
}
.profile-area img{
  width:118px;
  height:145px;
  object-fit:cover;
  object-position:50% 20%;
  border-radius:10px;
  display:block;
  margin-left:auto;
}
.menu-toggle{
  margin-top:5px;
  width:118px;
  min-height:32px;
  border:1px solid var(--yellow);
  background:#050505;
  color:var(--yellow);
  border-radius:7px;
  cursor:pointer;
  font-weight:900;
  font-size:.9rem;
}
.dropdown{
  display:none;
  position:absolute;
  top:184px;
  right:0;
  width:220px;
  padding:8px;
  background:#050505;
  border:1px solid var(--yellow);
  border-radius:10px;
  box-shadow:0 15px 45px rgba(0,0,0,.5);
  text-align:left;
}
.dropdown.open{display:block}
.dropdown a{
  display:block;
  text-decoration:none;
  color:var(--yellow);
  padding:10px 11px;
  border-radius:7px;
  font-weight:800;
  font-size:.93rem;
}
.dropdown a:hover{background:#191300;color:#fff0a5}
.main{
  width:min(850px,calc(100% - 36px));
  margin:0 auto;
  padding:55px 0 40px;
}
.brand-description{
  text-align:center;
  margin:0 auto 18px;
  color:#d7d7d7;
  font-size:.9rem;
  font-weight:600;
}
.course-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;
  max-width:620px;
  margin:20px auto 0;
}
.course-card{
  min-height:130px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  text-decoration:none;
  border:2px solid var(--red);
  border-radius:12px;
  background:#050505;
  padding:18px;
  transition:.15s ease;
}
.course-card:hover{
  transform:translateY(-2px);
  background:#0d0606;
  box-shadow:0 0 0 1px rgba(245,196,0,.28),0 10px 28px rgba(0,0,0,.5);
}
.course-card h2,.course-card h3{
  margin:0;
  color:var(--yellow);
  font-size:1.25rem;
  line-height:1.2;
}
.math-icon{
  color:var(--red);
  font-size:2.2rem;
  line-height:1;
  margin-bottom:12px;
  font-weight:900;
}
.socials{
  margin:48px auto 0;
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}
.social-link{
  min-width:125px;
  padding:10px 14px;
  text-decoration:none;
  border:1px solid var(--yellow);
  border-radius:8px;
  color:var(--yellow);
  text-align:center;
  font-weight:800;
  background:#050505;
}
.social-link:hover{background:#171200}
.social-handle{
  display:block;
  margin-top:3px;
  color:#ff4b50;
  font-size:.76rem;
  font-weight:700;
}
.page-title{
  color:var(--yellow);
  text-align:center;
  font-size:clamp(2rem,5vw,3.2rem);
  margin:0 0 34px;
}
.unit-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.small-card{
  min-height:92px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  text-decoration:none;
  padding:14px;
  border:1px solid var(--red);
  border-radius:9px;
  color:var(--yellow);
  background:#060606;
  font-weight:800;
}
.small-card:hover{background:#120707}
.small-card.disabled{opacity:.38;cursor:default}
.back-link{
  display:inline-block;
  margin:0 0 24px;
  color:var(--yellow);
  text-decoration:none;
  font-weight:800;
  font-size:.9rem;
}
.bottom-portrait{
  position:fixed;
  bottom:10px;
  width:118px;
  height:145px;
  object-fit:cover;
  object-position:50% 20%;
  opacity:1;
  pointer-events:none;
  border-radius:10px;
}
.bottom-portrait.left{left:18px}
.bottom-portrait.right{right:18px}
.footer{
  width:min(850px,calc(100% - 36px));
  margin:65px auto 0;
  padding:18px 0 25px;
  border-top:1px solid var(--red-dark);
  text-align:center;
  color:var(--yellow);
  font-size:.8rem;
}
@media(max-width:760px){
  .topbar{padding:13px 100px;min-height:74px}
  .corner-person{width:72px;height:88px}
  .profile-area{width:78px;right:8px}
  .profile-area img{width:72px;height:88px}
  .menu-toggle{width:72px;font-size:.7rem;padding:5px 2px}
  .dropdown{top:122px;width:190px}
  .corner-person.top-left{left:8px}
  .main{padding-top:38px}
  .course-grid{grid-template-columns:1fr;max-width:330px}
  .unit-grid{grid-template-columns:1fr}
  .bottom-portrait{display:none}
}
.tm-mark{
  font-size:.38em;
  vertical-align:super;
  margin-left:.08em;
  line-height:0;
}
</style>
<script type="application/ld+json" data-batchmath-site-name>{"@context":"https://schema.org","@type":"WebSite","name":"BatchMath","url":"https://batchmath.net/"}</script>
</head>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const button = document.querySelector(".menu-toggle");
  const menu = document.querySelector(".dropdown");
  if (!button || !menu) return;

  button.addEventListener("click", function(e){
    e.stopPropagation();
    menu.classList.toggle("open");
    button.setAttribute("aria-expanded", menu.classList.contains("open") ? "true" : "false");
  });

  document.addEventListener("click", function(){
    menu.classList.remove("open");
    button.setAttribute("aria-expanded","false");
  });

  menu.addEventListener("click", function(e){ e.stopPropagation(); });
});
</script>


<script data-batchmath-local-preview="1">
(function(){
  if (window.location.protocol !== 'file:') return;
  function localizeDirectoryUrl(value){
    if (!value || /^(?:[a-z][a-z0-9+.-]*:|#|\/)/i.test(value)) return value;
    var hash = '';
    var query = '';
    var hashAt = value.indexOf('#');
    if (hashAt >= 0) { hash = value.slice(hashAt); value = value.slice(0, hashAt); }
    var queryAt = value.indexOf('?');
    if (queryAt >= 0) { query = value.slice(queryAt); value = value.slice(0, queryAt); }
    if (value.endsWith('/')) value += 'index.html';
    return value + query + hash;
  }
  document.querySelectorAll('a[href]').forEach(function(link){
    link.setAttribute('href', localizeDirectoryUrl(link.getAttribute('href')));
  });
  document.querySelectorAll('option[value]').forEach(function(option){
    option.setAttribute('value', localizeDirectoryUrl(option.getAttribute('value')));
  });
})();
</script>

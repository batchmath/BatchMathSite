name: Package BatchMath v12.8.X
on:
  push:
    branches: [claude/v12.8x-unit5-calculator-rounding-polish]
    paths: [.github/workflows/package-v12-8-x.yml]
permissions:
  contents: write
jobs:
  package:
    if: github.repository == 'batchmath/BatchMathSite' && github.ref == 'refs/heads/claude/v12.8x-unit5-calculator-rounding-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_COMMIT: 25de1cfb28d90ae22a7c679ec9b2215aee8d0cc3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the reviewed W parent and a workflow-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$QA_COMMIT"
          test "$(git diff --name-status "$QA_COMMIT" "$GITHUB_SHA")" = $'A\t.github/workflows/package-v12-8-x.yml'
          git merge-base --is-ancestor b3498035f930abe5cb0205c9f9871e50cb8316a7 "$QA_COMMIT"
          test "$(git show "$QA_COMMIT:assets/app-version.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = '12.8.X'
      - name: Package the reviewed commit and verify every file
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip -9 --prefix=batchmath-site-v12.8.X/ --output=batchmath-site-v12.8.X.zip "$QA_COMMIT"
          unzip -tq batchmath-site-v12.8.X.zip
          python3 - <<'CHECK'
          import hashlib, os, subprocess, zipfile
          commit = os.environ['QA_COMMIT']
          tree = {}
          for line in subprocess.run(['git', 'ls-tree', '-r', '-z', commit], check=True, capture_output=True).stdout.decode().split('\0'):
              if line:
                  meta, path = line.split('\t', 1)
                  tree['batchmath-site-v12.8.X/' + path] = meta.split()[2]
          # .gitattributes keeps the developer-only review lab (and itself) out of the package; nothing else
          attrs = subprocess.run(['git', 'show', commit + ':.gitattributes'], check=True, capture_output=True).stdout.decode()
          ignored = sorted(l.split()[0].strip('/') for l in attrs.splitlines() if l.strip() and not l.startswith('#') and 'export-ignore' in l.split()[1:])
          assert ignored == ['.gitattributes', 'tools/review-lab'], ignored
          prefix = 'batchmath-site-v12.8.X/'
          tree = {k: v for k, v in tree.items() if not (k == prefix + '.gitattributes' or k.startswith(prefix + 'tools/review-lab/'))}
          with zipfile.ZipFile('batchmath-site-v12.8.X.zip') as z:
              files = {i.filename: i for i in z.infolist() if not i.is_dir()}
              assert set(files) == set(tree), 'file list differs from the commit'
              for name, blob in tree.items():
                  data = z.read(name)
                  assert hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest() == blob, name
          bad = [n for n in files if any(c in n for c in '<>:"\\|?*') or n.endswith((' ', '.'))]
          assert not bad, bad
          assert not any('/node_modules/' in n for n in files)
          print('Files verified against', commit, ':', len(files))
          CHECK
          sha256sum batchmath-site-v12.8.X.zip | tee batchmath-site-v12.8.X.sha256
      - name: Verify protected refs and publish the v12.8.X prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/claude/v12.8x-unit5-calculator-rounding-polish" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = 'b3498035f930abe5cb0205c9f9871e50cb8316a7' || { echo '::error::main changed'; exit 1; }
          checksum="$(cut -d' ' -f1 batchmath-site-v12.8.X.sha256)"
          {
            echo 'Review build for teacher testing. Not deployed: production `main` is unchanged (v12.8.V, b349803).'
            echo 'Not approved: automated QA passed, and the build awaits the teacher'"'"'s review.'
            echo
            echo "Source: branch \`claude/v12.8x-unit5-calculator-rounding-polish\`, commit $QA_COMMIT."
            echo
            echo 'Builds on the v12.8.W Unit 5 review build (tag v12.8.W).'
            echo '- Strict rounding: a rounded answer must equal the correctly rounded value (half away from zero); .923, trailing zeros, $1.2 for $1.20 accepted; neighbouring values and unrounded values rejected.'
            echo '- Calculator Practice and Non-Calculator Practice pages for Basic First-Order, Motion and Rate Problems (the practice/ pages remain as Mixed Practice), with more calculator variety.'
            echo '- Rate Problems limited to accumulation (25/25/25/15/10); FRQ-style derivative, increasing/decreasing, extreme and threshold questions removed; exact non-calculator problems in every family.'
            echo '- Clearer explanations: Motion total distance with absolute values only on negative pieces; Separable exponent laws and branches.'
            echo '- Calculator Review (2:2:1:1) and Non-Calculator Review (2:2:2:2:1) next to the Mixed Review (20/20/20/20/10/10); difficulty 40/40/20 in all three.'
            echo
            echo 'See docs/v12.8.X-revisions.md and docs/v12.8.X-progress.md. Serve the extracted folder with `py -m http.server 8000`.'
            echo
            echo "SHA-256 of batchmath-site-v12.8.X.zip: $checksum"
          } > release-notes-x.md
          if gh release view v12.8.X --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::A v12.8.X release already exists; not changing it.'; exit 1
          fi
          gh release create v12.8.X batchmath-site-v12.8.X.zip --repo "$GITHUB_REPOSITORY" --target "$QA_COMMIT" --title 'BatchMath v12.8.X (review build)' --notes-file release-notes-x.md --prerelease --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v12.8.X" > "$RUNNER_TEMP/x-release.json"
          python3 - "$checksum" <<'CHECK'
          import json, os, sys
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'x-release.json').read_text())
          assert release['tag_name'] == 'v12.8.X' and release['prerelease'] is True and release['draft'] is False
          asset = [a for a in release['assets'] if a['name'] == 'batchmath-site-v12.8.X.zip']
          assert len(asset) == 1 and asset[0]['state'] == 'uploaded'
          assert asset[0]['size'] == Path('batchmath-site-v12.8.X.zip').stat().st_size
          assert asset[0].get('digest') in (None, 'sha256:' + sys.argv[1])
          print('Release:', release['html_url'])
          print('Download:', asset[0]['browser_download_url'])
          CHECK
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = 'b3498035f930abe5cb0205c9f9871e50cb8316a7'

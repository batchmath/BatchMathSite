name: Package BatchMath v12.9.B
on:
  push:
    branches: [claude/v12.9b-unit6-teacher-corrections]
    paths: [.github/workflows/package-v12-9-b.yml]
permissions:
  contents: write
jobs:
  package:
    if: github.repository == 'batchmath/BatchMathSite' && github.ref == 'refs/heads/claude/v12.9b-unit6-teacher-corrections'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_COMMIT: ca4fb4aa463ba43a8d66dc3d5ad91c9300343fbb
      MAIN_SHA: 26ec4f15185c37f9e8843e96a09d583b47babcdf
      A_BRANCH_SHA: dccdd153f1522b9e72c94e97279b528483749c87
      A_TAG_SHA: 8e58d2f4cd2513bcc52693f4fa050a4e6218e4f9
      CHECKPOINT_SHA: 0d4dfbaad4e98176ba75c7ce56a2b742f0f8d363
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the reviewed B commit, its v12.9.A and checkpoint bases and a workflow-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$QA_COMMIT"
          test "$(git diff --name-status "$QA_COMMIT" "$GITHUB_SHA")" = $'A\t.github/workflows/package-v12-9-b.yml'
          git merge-base --is-ancestor "$MAIN_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$A_BRANCH_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$CHECKPOINT_SHA" "$QA_COMMIT"
          # teaching materials stay outside the repository: no PDF or Word file is added or changed since main
          test -z "$(git diff --name-only --diff-filter=AM "$MAIN_SHA" "$QA_COMMIT" | grep -Ei '\.(pdf|docx?)$' || true)"
          test "$(git show "$QA_COMMIT:assets/app-version.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = '12.9.B'
      - name: Package the reviewed commit and verify every file
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip -9 --prefix=batchmath-site-v12.9.B/ --output=batchmath-site-v12.9.B.zip "$QA_COMMIT"
          unzip -tq batchmath-site-v12.9.B.zip
          python3 - <<'CHECK'
          import hashlib, os, subprocess, zipfile
          commit = os.environ['QA_COMMIT']
          prefix = 'batchmath-site-v12.9.B/'
          tree = {}
          for line in subprocess.run(['git', 'ls-tree', '-r', '-z', commit], check=True, capture_output=True).stdout.decode().split('\0'):
              if line:
                  meta, path = line.split('\t', 1)
                  tree[prefix + path] = meta.split()[2]
          # .gitattributes keeps the developer-only review lab (and itself) out of the package; nothing else
          attrs = subprocess.run(['git', 'show', commit + ':.gitattributes'], check=True, capture_output=True).stdout.decode()
          ignored = sorted(l.split()[0].strip('/') for l in attrs.splitlines() if l.strip() and not l.startswith('#') and 'export-ignore' in l.split()[1:])
          assert ignored == ['.gitattributes', 'tools/review-lab'], ignored
          tree = {k: v for k, v in tree.items() if not (k == prefix + '.gitattributes' or k.startswith(prefix + 'tools/review-lab/'))}
          with zipfile.ZipFile('batchmath-site-v12.9.B.zip') as z:
              files = {i.filename: i for i in z.infolist() if not i.is_dir()}
              assert set(files) == set(tree), 'file list differs from the commit'
              for name, blob in tree.items():
                  data = z.read(name)
                  assert hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest() == blob, name
          bad = [n for n in files if any(c in n for c in '<>:"\\|?*') or n.endswith((' ', '.'))]
          assert not bad, bad
          assert not any('/node_modules/' in n for n in files)
          assert not any(n.lower().endswith(('.pdf', '.doc', '.docx')) and '/docs/' in n for n in files)
          for need in ['assets/unit6-core.js', 'assets/unit6-volume.js', 'assets/unit6-piecewise.js', 'assets/unit6-review.js', 'assets/unit6.css',
                       'docs/v12.9.B-revisions.md', 'docs/v12.9.B-progress.md', 'docs/v12.9.B-unit6-mathlive-handoff.md',
                       'ap-calculus/unit-6-applications-integration/topics/integrals-on-piecewise-defined-functions/practice/index.html',
                       'ap-calculus/unit-6-applications-integration/topics/comprehensive-review/non-calculator-practice/index.html']:
              assert prefix + need in files, need
          print('Files verified against', commit, ':', len(files))
          CHECK
          sha256sum batchmath-site-v12.9.B.zip | tee batchmath-site-v12.9.B.sha256
      - name: Verify protected refs and releases, publish the v12.9.B prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          ref() { gh api "repos/$R/git/ref/$1" --jq .object.sha; }
          # every release so far is a prerelease, so there is no "latest" release (404); it must stay that way
          latest() { local t; if t="$(gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null)"; then echo "$t"; else echo none; fi; }
          protected() {
            test "$(ref heads/main)" = "$MAIN_SHA" || { echo '::error::main changed'; exit 1; }
            test "$(ref heads/claude/v12.9a-unit6-curriculum-alignment)" = "$A_BRANCH_SHA" || { echo '::error::v12.9.A branch changed'; exit 1; }
            test "$(ref heads/claude/v12.9b-unit6-display-checkpoint)" = "$CHECKPOINT_SHA" || { echo '::error::checkpoint branch changed'; exit 1; }
            test "$(ref tags/v12.9.A)" = "$A_TAG_SHA" || { echo '::error::v12.9.A tag changed'; exit 1; }
            gh api "repos/$R/releases/tags/v12.9.A" --jq '[.prerelease, .draft, .updated_at, (.assets | map(.name + " " + (.digest // "") + " " + (.size|tostring)) | join(","))] | @tsv'
          }
          test "$(ref heads/claude/v12.9b-unit6-teacher-corrections)" = "$GITHUB_SHA"
          a_before="$(protected)"; latest_before="$(latest)"
          echo "v12.9.A release: $a_before"; echo "latest release: $latest_before"
          test "$(echo "$a_before" | cut -f1,2)" = $'true\tfalse'
          checksum="$(cut -d' ' -f1 batchmath-site-v12.9.B.sha256)"
          {
            echo 'Review build for teacher testing. Not deployed: production `main` is unchanged (v12.8.Y, 26ec4f1).'
            echo 'Not approved: automated QA passed, and the build awaits the teacher'"'"'s review. The v12.9.A prerelease is unchanged.'
            echo
            echo "Source: branch \`claude/v12.9b-unit6-teacher-corrections\`, commit $QA_COMMIT."
            echo
            echo 'Unit 6 teacher-testing corrections to v12.9.A; everything else is as in v12.9.A.'
            echo '- Explanations: no redundant parentheses or written coefficients of 1, signed-area arithmetic shown, round only the final answer; compact area graphs.'
            echo '- Area: setups with respect to x, y, either or both; setup only or with the value; graphs in explanations; a Choosing dx or dy Practice Type with typed integrals.'
            echo '- Area in terms of y: a graph in every explanation, mixed y = f(x) and x = g(y) forms, no supplied bounds the curves define.'
            echo '- Piecewise integrals: typed exact answers; the explanation splits the integral and evaluates each piece.'
            echo '- Cross sections: Show Graph / Hide Graph in non-calculator questions; the base with one slice and the cross section in the explanation; half perpendicular to each axis.'
            echo '- Solids: the graph in about half the non-calculator questions with the axis inside the frame; R and r or the shell radius and height drawn in the explanation; no question graph on calculator problems; more calculator axes; a two-axis calculator problem.'
            echo '- Integral setups are graded by their structure, not only their value: other methods or variables are accepted where the problem lists them, and a setup that only has the right value is refused.'
            echo '- Review Practice Types renamed: Area & Volume — Multi-Part Practice; Graph Analysis & Accumulation — Multi-Part Practice (labels only).'
            echo '- MathLive is not part of this build (separate migration); see docs/v12.9.B-unit6-mathlive-handoff.md.'
            echo
            echo 'See docs/v12.9.B-revisions.md (changes, distributions, teacher checklist, limitations) and docs/v12.9.B-progress.md (commits, checks). Serve the extracted folder with `py -m http.server 8000`.'
            echo
            echo "SHA-256 of batchmath-site-v12.9.B.zip: $checksum"
          } > release-notes-b.md
          if gh release view v12.9.B --repo "$R" > /dev/null 2>&1; then
            echo '::error::A v12.9.B release already exists; not changing it.'; exit 1
          fi
          gh release create v12.9.B batchmath-site-v12.9.B.zip --repo "$R" --target "$QA_COMMIT" --title 'BatchMath v12.9.B (review build)' --notes-file release-notes-b.md --prerelease --latest=false
          gh api "repos/$R/releases/tags/v12.9.B" > "$RUNNER_TEMP/b-release.json"
          python3 - "$checksum" <<'CHECK'
          import json, os, sys
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'b-release.json').read_text())
          assert release['tag_name'] == 'v12.9.B' and release['prerelease'] is True and release['draft'] is False
          asset = [a for a in release['assets'] if a['name'] == 'batchmath-site-v12.9.B.zip']
          assert len(asset) == 1 and asset[0]['state'] == 'uploaded'
          assert asset[0]['size'] == Path('batchmath-site-v12.9.B.zip').stat().st_size
          assert asset[0].get('digest') in (None, 'sha256:' + sys.argv[1])
          print('Release:', release['html_url'])
          print('Download:', asset[0]['browser_download_url'])
          CHECK
          test "$(ref tags/v12.9.B)" = "$QA_COMMIT"
          test "$(protected)" = "$a_before" || { echo '::error::v12.9.A release changed'; exit 1; }
          test "$(latest)" = "$latest_before" || { echo '::error::the latest release changed'; exit 1; }

name: Package BatchMath v12.9.C integration test build
on:
  push:
    branches: [integration/unit6-mathlive-videos-final-test]
    paths: [.github/workflows/package-v12-9-c-integration-test.yml]
permissions:
  contents: write
jobs:
  package:
    if: github.repository == 'batchmath/BatchMathSite' && github.ref == 'refs/heads/integration/unit6-mathlive-videos-final-test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_COMMIT: c5068a8c09ba64b8ce7d9c7e89af2c5dfecb5ad8
      MAIN_SHA: 26ec4f15185c37f9e8843e96a09d583b47babcdf
      A_BRANCH_SHA: dccdd153f1522b9e72c94e97279b528483749c87
      A_TAG_SHA: 8e58d2f4cd2513bcc52693f4fa050a4e6218e4f9
      CHECKPOINT_SHA: 0d4dfbaad4e98176ba75c7ce56a2b742f0f8d363
      B_BRANCH_SHA: bfabb6cecfba03a68ff6bbf8c591c1172861f10f
      B_TAG_SHA: ca4fb4aa463ba43a8d66dc3d5ad91c9300343fbb
      MATHLIVE_SHA: 63ef79b1271974072daa2f1f99a968671a45f2c7
      GRAPH_SHA: e265804f440b2e521de00ecff0f6bc33118a12f1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tested commit, both sources as its ancestors and a workflow-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$QA_COMMIT"
          test "$(git diff --name-status "$QA_COMMIT" "$GITHUB_SHA")" = $'A\t.github/workflows/package-v12-9-c-integration-test.yml'
          git merge-base --is-ancestor "$MAIN_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$A_BRANCH_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$CHECKPOINT_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$B_BRANCH_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$GRAPH_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$MATHLIVE_SHA" "$QA_COMMIT"
          # teaching materials stay outside the repository: no PDF or Word file is added or changed since main
          test -z "$(git diff --name-only --diff-filter=AM "$MAIN_SHA" "$QA_COMMIT" | grep -Ei '\.(pdf|docx?)$' || true)"
          test "$(git show "$QA_COMMIT:assets/app-version.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = '12.9.C'
      - name: Package the reviewed commit and verify every file
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip -9 --prefix=batchmath-site-v12.9.C-integration-test/ --output=batchmath-site-v12.9.C-integration-test.zip "$QA_COMMIT"
          unzip -tq batchmath-site-v12.9.C-integration-test.zip
          python3 - <<'CHECK'
          import hashlib, os, subprocess, zipfile
          commit = os.environ['QA_COMMIT']
          prefix = 'batchmath-site-v12.9.C-integration-test/'
          tree = {}
          for line in subprocess.run(['git', 'ls-tree', '-r', '-z', commit], check=True, capture_output=True).stdout.decode().split('\0'):
              if line:
                  meta, path = line.split('\t', 1)
                  tree[prefix + path] = meta.split()[2]
          # .gitattributes keeps the developer-only review lab (and itself) out of the package; nothing else
          attrs = subprocess.run(['git', 'show', commit + ':.gitattributes'], check=True, capture_output=True).stdout.decode()
          ignored = sorted(l.split()[0].strip('/') for l in attrs.splitlines() if l.strip() and not l.startswith('#') and 'export-ignore' in l.split()[1:])
          # the MathLive/video source's export policy: developer tooling, workflows and QA evidence stay out of the package
          assert ignored == sorted(['.gitattributes', '.github', 'tools', 'docs/audits/evidence', 'docs/integration/evidence', 'docs/audits/COMPREHENSIVE-REVIEW-INSTRUCTIONS.json', 'docs/audits/VIDEO-HIERARCHY.json']), ignored
          tree = {k: v for k, v in tree.items() if not any(k == prefix + d or k.startswith(prefix + d + '/') for d in ignored)}
          with zipfile.ZipFile('batchmath-site-v12.9.C-integration-test.zip') as z:
              files = {i.filename: i for i in z.infolist() if not i.is_dir()}
              assert set(files) == set(tree), 'file list differs from the commit'
              for name, blob in tree.items():
                  data = z.read(name)
                  assert hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest() == blob, name
          bad = [n for n in files if any(c in n for c in '<>:"\\|?*') or n.endswith((' ', '.'))]
          assert not bad, bad
          assert not any('/node_modules/' in n for n in files)
          assert not any(n.lower().endswith(('.pdf', '.doc', '.docx')) and '/docs/' in n for n in files)
          for need in ['assets/unit6-core.js', 'assets/unit6-ui.js', 'assets/unit6-volume.js', 'assets/unit6-piecewise.js', 'assets/unit6-review.js', 'assets/unit6.css',
                       'assets/mathlive/unit6.mjs', 'assets/mathlive/integral-setup.mjs', 'assets/mathlive/vendor/mathlive/mathlive.min.mjs', 'assets/instructional-videos.js',
                       'docs/v12.9.C-integration-test.md', 'docs/v12.9.C-integration-test-progress.md',
                       'ap-calculus/unit-6-applications-integration/topics/integrals-on-piecewise-defined-functions/practice/index.html',
                       'ap-calculus/unit-6-applications-integration/topics/comprehensive-review/non-calculator-practice/index.html']:
              assert prefix + need in files, need
          print('Files verified against', commit, ':', len(files))
          CHECK
          sha256sum batchmath-site-v12.9.C-integration-test.zip | tee batchmath-site-v12.9.C-integration-test.sha256
      - name: Verify protected refs and releases, publish the integration test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          TAG='v12.9.C-integration-test'
          ref() { gh api "repos/$R/git/ref/$1" --jq .object.sha; }
          # every release so far is a prerelease, so there is no "latest" release (404); it must stay that way
          latest() { local t; if t="$(gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null)"; then echo "$t"; else echo none; fi; }
          rel() { gh api "repos/$R/releases/tags/$1" --jq '[.prerelease, .draft, .updated_at, (.assets | map(.name + " " + (.digest // "") + " " + (.size|tostring)) | join(","))] | @tsv'; }
          protected() {
            test "$(ref heads/main)" = "$MAIN_SHA" || { echo '::error::main changed'; exit 1; }
            test "$(ref heads/claude/v12.9a-unit6-curriculum-alignment)" = "$A_BRANCH_SHA" || { echo '::error::v12.9.A branch changed'; exit 1; }
            test "$(ref heads/claude/v12.9b-unit6-display-checkpoint)" = "$CHECKPOINT_SHA" || { echo '::error::checkpoint branch changed'; exit 1; }
            test "$(ref heads/claude/v12.9b-unit6-teacher-corrections)" = "$B_BRANCH_SHA" || { echo '::error::v12.9.B branch changed'; exit 1; }
            test "$(ref heads/integration/mathlive-im1-videos-content)" = "$MATHLIVE_SHA" || { echo '::error::MathLive/video source changed'; exit 1; }
            test "$(ref heads/claude/unit6-final-graph-corrections)" = "$GRAPH_SHA" || { echo '::error::graph corrections branch changed'; exit 1; }
            test "$(ref tags/v12.9.A)" = "$A_TAG_SHA" || { echo '::error::v12.9.A tag changed'; exit 1; }
            test "$(ref tags/v12.9.B)" = "$B_TAG_SHA" || { echo '::error::v12.9.B tag changed'; exit 1; }
            rel v12.9.A; rel v12.9.B
          }
          test "$(ref heads/integration/unit6-mathlive-videos-final-test)" = "$GITHUB_SHA"
          before="$(protected)"; latest_before="$(latest)"
          echo "existing prereleases: $before"; echo "latest release: $latest_before"
          checksum="$(cut -d' ' -f1 batchmath-site-v12.9.C-integration-test.sha256)"
          {
            echo 'INTEGRATION TEST BUILD for teacher testing. Not production, not deployed, not approved: production `main` is unchanged (v12.8.Y, 26ec4f1). The v12.9.A and v12.9.B prereleases are unchanged.'
            echo
            echo "Source: branch \`integration/unit6-mathlive-videos-final-test\`, tested commit $QA_COMMIT. It combines the Unit 6 v12.9.B corrections (bfabb6c), the Unit 6 graph fix (e265804) and the approved MathLive, IM1 video and content work (63ef79b)."
            echo
            echo '- Unit 6 graphs: the frame always holds every shaded region, intersection and extreme with padding (the cut-off cubic lobes are fixed); axes of rotation stay in the frame; compact and single-scale graphs as before.'
            echo '- Unit 6 integral setups: ONE blank MathLive field in which the student writes the whole setup (integral key or "int", limits, integrand, dx/dy, numbers in front, sums of integrals); graded by the v12.9.B structural checker (a setup with only the right value is still refused).'
            echo '- Every Unit 6 typed answer uses MathLive; Unit 6 topic pages use the approved video presentation.'
            echo '- MathLive migrations, IM1 videos and content from the integration branch are preserved.'
            echo '- Not included: 3D models; collapsing Part A explanations.'
            echo
            echo 'See docs/v12.9.C-integration-test.md and docs/v12.9.C-integration-test-progress.md. Serve the extracted folder with `py -m http.server 8000` (Windows) or `python3 -m http.server 8000`, then open http://localhost:8000/.'
            echo
            echo "SHA-256 of batchmath-site-v12.9.C-integration-test.zip: $checksum"
          } > release-notes-c.md
          if gh release view "$TAG" --repo "$R" > /dev/null 2>&1; then
            echo "::error::A $TAG release already exists; not changing it."; exit 1
          fi
          gh release create "$TAG" batchmath-site-v12.9.C-integration-test.zip --repo "$R" --target "$QA_COMMIT" --title 'BatchMath v12.9.C — MathLive, Videos & Unit 6 Integration Test' --notes-file release-notes-c.md --prerelease --latest=false
          gh api "repos/$R/releases/tags/$TAG" > "$RUNNER_TEMP/c-release.json"
          python3 - "$checksum" <<'CHECK'
          import json, os, sys
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'c-release.json').read_text())
          assert release['tag_name'] == 'v12.9.C-integration-test' and release['prerelease'] is True and release['draft'] is False
          asset = [a for a in release['assets'] if a['name'] == 'batchmath-site-v12.9.C-integration-test.zip']
          assert len(asset) == 1 and asset[0]['state'] == 'uploaded'
          assert asset[0]['size'] == Path('batchmath-site-v12.9.C-integration-test.zip').stat().st_size
          assert asset[0].get('digest') in (None, 'sha256:' + sys.argv[1])
          print('Release:', release['html_url'])
          print('Download:', asset[0]['browser_download_url'])
          CHECK
          test "$(ref tags/$TAG)" = "$QA_COMMIT"
          test "$(protected)" = "$before" || { echo '::error::a protected ref or release changed'; exit 1; }
          test "$(latest)" = "$latest_before" || { echo '::error::the latest release changed'; exit 1; }

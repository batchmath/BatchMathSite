name: Package BatchMath v12.9.E final integration test
on:
  push:
    branches: [integration/v12.9e-final]
    paths: [.github/workflows/package-v12-9-e-final-test.yml]
permissions:
  contents: write
jobs:
  package:
    if: github.repository == 'batchmath/BatchMathSite' && github.ref == 'refs/heads/integration/v12.9e-final'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_COMMIT: 2fbfd3f7eb482fd6ef5f890ba86fe2a9554db8b6
      SOURCE_A: 98c9beb3c0eb58a952f6bb29e410e63aa280003e
      SOURCE_B: 049e8a49d22f3d5ff67f5a79a855ec0028452ab7
      MAIN_SHA: 26ec4f15185c37f9e8843e96a09d583b47babcdf
      TAG: v12.9.E
      ZIP: batchmath-site-v12.9.E.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tested tree and both preserved histories
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_A" "$QA_COMMIT"
          git merge-base --is-ancestor "$SOURCE_B" "$QA_COMMIT"
          test "$(git show -s --format=%P HEAD)" = "$QA_COMMIT"
          python3 - <<'CHECK'
          import os, subprocess
          changed=subprocess.check_output(['git','diff','--name-only',os.environ['QA_COMMIT'],os.environ['GITHUB_SHA']],text=True).splitlines()
          allowed={'.github/workflows/package-v12-9-e-final-test.yml','docs/v12.9.E-final-integration.md'}
          assert set(changed)<=allowed and '.github/workflows/package-v12-9-e-final-test.yml' in changed,changed
          CHECK
      - name: Build and programmatically verify the exact complete website package
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/final-integration/package.py --commit "$QA_COMMIT" --out "$RUNNER_TEMP/delivery"
      - name: Snapshot protected sources, tags, prereleases and latest status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          ref() { gh api "repos/$R/git/ref/heads/$1" --jq .object.sha; }
          test "$(ref main)" = "$MAIN_SHA"
          test "$(ref integration/mathlive-im1-videos-content)" = "$SOURCE_A"
          test "$(ref claude/v12.9d-unit6-final-corrections)" = "$SOURCE_B"
          test "$(ref migration/mathlive-sitewide)" = '919ca1806f07e3cd2af552142926e7ca2b78e8d5'
          test "$(ref content/im1-video-notes-cleanup)" = 'bba32f929d6630d096bc4510ceafd586ab8c4a53'
          test "$(ref integration/v12.9e-final)" = "$GITHUB_SHA"
          gh api "repos/$R/git/matching-refs/tags/" > "$RUNNER_TEMP/tags-before.json"
          python3 - <<'CHECK'
          import json, os
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNNER_TEMP'])/'tags-before.json').read_text())
          assert not any(r['ref']=='refs/tags/'+os.environ['TAG'] for r in rows),'The requested tag already exists; it will not be reused or changed.'
          CHECK
          gh api --paginate --slurp "repos/$R/releases?per_page=100" > "$RUNNER_TEMP/releases-before.json"
          if gh release view "$TAG" --repo "$R" > /dev/null 2>&1; then
            echo "::error::The requested test prerelease already exists; it will not be overwritten."
            exit 1
          fi
          if gh api "repos/$R/releases/latest" --jq .tag_name > "$RUNNER_TEMP/latest-before.txt" 2>/dev/null; then :; else echo none > "$RUNNER_TEMP/latest-before.txt"; fi
      - name: Publish only the authorized test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'NOTES'
          import os
          from pathlib import Path
          sha=os.environ['QA_COMMIT']
          notes=f'''BatchMath v12.9.E teacher test build. Prerelease, not latest. Production main and both approved sources are unchanged; no deployment is performed.

          This combines the completed MathLive/video/keypad foundation (98c9beb) with the final Unit 6 mathematics, one blank integral-setup field, structural grading and videos (049e8a4).

          Tested website commit: {sha}.

          [Final integration report and inherited-test classifications](https://github.com/batchmath/BatchMathSite/blob/{os.environ['GITHUB_SHA']}/docs/v12.9.E-final-integration.md)

          Extract batchmath-site-v12.9.E.zip. Open a terminal inside batchmath-site-v12.9.E, run `py -m http.server 8000`, and open http://localhost:8000/.

          The ZIP contains the complete website, practice engines, PDFs, and pinned local MathLive runtime/fonts. Normal MathJax and YouTube use requires internet. Actual YouTube availability and audio need human review.
          '''
          (Path(os.environ['RUNNER_TEMP'])/'release-notes-e.md').write_text(notes)
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/delivery/$ZIP" "$RUNNER_TEMP/delivery/batchmath-site-v12.9.E.sha256" "$RUNNER_TEMP/delivery/delivery-manifest.json" --repo "$GITHUB_REPOSITORY" --target "$QA_COMMIT" --title 'BatchMath v12.9.E — Final Integration Test' --notes-file "$RUNNER_TEMP/release-notes-e.md" --prerelease --latest=false
      - name: Download the published ZIP and verify its bytes and complete site tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/downloaded"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP" --dir "$RUNNER_TEMP/downloaded"
          cmp "$RUNNER_TEMP/downloaded/$ZIP" "$RUNNER_TEMP/delivery/$ZIP"
          python3 tools/final-integration/package.py --commit "$QA_COMMIT" --zip "$RUNNER_TEMP/downloaded/$ZIP" --out "$RUNNER_TEMP/download-verified"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/e-release.json"
          python3 - <<'CHECK'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          release=json.loads((root/'e-release.json').read_text())
          manifest=json.loads((root/'delivery/delivery-manifest.json').read_text())
          assert release['prerelease'] is True and release['draft'] is False
          assets=[a for a in release['assets'] if a['name']==os.environ['ZIP']]
          assert len(assets)==1 and assets[0]['state']=='uploaded'
          assert assets[0]['size']==manifest['bytes']
          assert assets[0].get('digest') in (None,'sha256:'+manifest['sha256'])
          print('Verified download:',assets[0]['browser_download_url'])
          CHECK
      - name: Recheck every protected source, tag, prerelease and latest status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          ref() { gh api "repos/$R/git/ref/heads/$1" --jq .object.sha; }
          test "$(ref main)" = "$MAIN_SHA"
          test "$(ref integration/mathlive-im1-videos-content)" = "$SOURCE_A"
          test "$(ref claude/v12.9d-unit6-final-corrections)" = "$SOURCE_B"
          test "$(ref migration/mathlive-sitewide)" = '919ca1806f07e3cd2af552142926e7ca2b78e8d5'
          test "$(ref content/im1-video-notes-cleanup)" = 'bba32f929d6630d096bc4510ceafd586ab8c4a53'
          test "$(gh api "repos/$R/git/ref/tags/$TAG" --jq .object.sha)" = "$QA_COMMIT"
          gh api "repos/$R/git/matching-refs/tags/" > "$RUNNER_TEMP/tags-after.json"
          gh api --paginate --slurp "repos/$R/releases?per_page=100" > "$RUNNER_TEMP/releases-after.json"
          if gh api "repos/$R/releases/latest" --jq .tag_name > "$RUNNER_TEMP/latest-after.txt" 2>/dev/null; then :; else echo none > "$RUNNER_TEMP/latest-after.txt"; fi
          cmp "$RUNNER_TEMP/latest-before.txt" "$RUNNER_TEMP/latest-after.txt"
          python3 - <<'CHECK'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);tag=os.environ['TAG']
          def tags(name):
              return sorted((x['ref'],x['object']['sha']) for x in json.loads((root/name).read_text()) if x['ref']!='refs/tags/'+tag)
          assert tags('tags-before.json')==tags('tags-after.json'),'An earlier tag changed'
          def releases(name):
              rows=[r for page in json.loads((root/name).read_text()) for r in page if r['tag_name']!=tag]
              keys=['id','tag_name','name','body','prerelease','draft','target_commitish','updated_at']
              return sorted([{**{k:r[k] for k in keys},'assets':sorted([(a['id'],a['name'],a['size'],a.get('digest'),a['state'],a['updated_at']) for a in r['assets']])} for r in rows],key=lambda r:r['id'])
          assert releases('releases-before.json')==releases('releases-after.json'),'An earlier prerelease changed'
          print('Protected sources, earlier tags/prereleases and latest status are unchanged.')
          CHECK

name: SAT & ACT explanation controls review ZIP

on:
  push:
    branches: [codex/sat-act-explanation-controls]
    paths: ['.github/workflows/sat-act-explanations-review-zip.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7fbc7cbb1ee03e8876e50f0fb4565a71be1de157
          persist-credentials: false

      - name: Assemble the preview from the tested website commit
        run: |
          set -euo pipefail
          name=bm-sat-act-explanations
          preview="review/$name"
          mkdir -p review
          git archive --format=tar --prefix="$name/" HEAD | tar -x --exclude='*.pdf' -C review
          mkdir -p "$preview/docs/sat-act" "$preview/tools/sat-act/records" "$preview/QA"
          cp docs/sat-act/{PUBLISHING-WORKFLOW,GA4-ANALYTICS}.md "$preview/docs/sat-act/"
          cp tools/sat-act/records/IMPORT-MANIFEST.json "$preview/tools/sat-act/records/"
          git rev-parse HEAD > "$preview/REVIEW-COMMIT.txt"
          git ls-files '*.pdf' > "$preview/OMITTED-PDFS.txt"
          cat > "$preview/SAT-ACT-PREVIEW.txt" <<'README'
          BatchMath SAT & ACT Math Practice — explanation controls review

          Extract the archive and open the bm-sat-act-explanations folder in a terminal.
          Run py -m http.server 8000 on Windows or python3 -m http.server 8000 on
          macOS or Linux. Open http://localhost:8000/sat-act-math/ in your browser.
          Open a question, check a correct or incorrect answer, then choose
          Show Written Solution. The site uses MathJax to render the equations.

          The #001 and #003 Shorts are pending upload provenance verification.
          Each publication entry requires its public date and evidence tying its
          YouTube ID to the exact audited MP4 described in IMPORT-MANIFEST.json.
          The current website preview therefore offers written explanations only.
          The two screenshots in QA show the video-enabled controls using the
          existing simulated-video browser tests.

          This ZIP omits the classroom PDFs listed in OMITTED-PDFS.txt.
          Use the full repository checkout for a production release.
          README
          test "$(find "$preview/sat-act-math" -name index.html | wc -l)" -eq 12
          test "$(wc -l < "$preview/OMITTED-PDFS.txt")" -eq 346
          test -z "$(find "$preview" -iname '*.pdf' -print -quit)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the two button states and capture them for local review
        run: |
          set -euo pipefail
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/sat-act/sat-act-browser-qa.mjs').read_text()
          for label, filename in [
              ('incorrect answer offers both choices', '001-incorrect-answer.png'),
              ('correct answer offers both choices', '003-correct-answer.png'),
          ]:
              start = source.index("await scenario('" + label)
              target = '  await checkExplanationChoices(page, true);'
              position = source.index(target, start) + len(target)
              snippet = "\n  await page.locator('.satact-question-card').screenshot({ path: 'review/bm-sat-act-explanations/QA/" + filename + "' });"
              source = source[:position] + snippet + source[position:]
          Path('tools/sat-act/.review-browser-qa.mjs').write_text(source)
          PY
          node tools/sat-act/.review-browser-qa.mjs
          cp qa-results/sat-act-browser-qa.txt review/bm-sat-act-explanations/QA/
          test -s review/bm-sat-act-explanations/QA/001-incorrect-answer.png
          test -s review/bm-sat-act-explanations/QA/003-correct-answer.png
          find review -depth -type d -empty -delete

      - uses: actions/upload-artifact@v4
        with:
          name: bm-sat-act-explanations
          path: review/
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/download-artifact@v4
        with:
          name: bm-sat-act-explanations
          path: downloaded/

      - name: Verify archive contents
        run: diff -qr review/ downloaded/

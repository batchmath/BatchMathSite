name: Package BatchMath v13.0.D experimental 3D display toggle build
on:
  push:
    branches: [claude/v13.0d-3d-opacity-toggle]
    paths: [.github/workflows/package-v13-0-d.yml]
permissions:
  contents: write
jobs:
  package:
    if: github.repository == 'batchmath/BatchMathSite' && github.ref == 'refs/heads/claude/v13.0d-3d-opacity-toggle'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_COMMIT: 335dc3eedc63a8370387a70de91b548a43d460af
      MAIN_SHA: 9dbb4f841c6b4e6300c640e1b83b2dad82df1521
      V13A_SHA: 3993639a284f86632e11ec675bddecbf7f6b2294
      V13B_SHA: 848091047774fbeda6ec3aad4a5f0e1b0d8d1079
      V13C_SHA: cb9738a1ec32f6222fefad41f373f8a4197b9a9a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tested commit, main, v13.0.A, v13.0.B and v13.0.C as its ancestors and a workflow-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$QA_COMMIT"
          test "$(git diff --name-status "$QA_COMMIT" "$GITHUB_SHA")" = $'A\t.github/workflows/package-v13-0-d.yml'
          git merge-base --is-ancestor "$MAIN_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$V13A_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$V13B_SHA" "$QA_COMMIT"
          git merge-base --is-ancestor "$V13C_SHA" "$QA_COMMIT"
          test "$(git show "$QA_COMMIT:assets/app-version.json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["version"], d["release"])')" = '13.0.D v13.0.D'
      - name: Package the tested commit and verify every file
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip -9 --prefix=bm-v13.0.D/ --output=bm-v13.0.D.zip "$QA_COMMIT"
          unzip -tq bm-v13.0.D.zip
          python3 - <<'CHECK'
          import hashlib, os, subprocess, zipfile
          commit = os.environ['QA_COMMIT']
          prefix = 'bm-v13.0.D/'
          tree = {}
          for line in subprocess.run(['git', 'ls-tree', '-r', '-z', commit], check=True, capture_output=True).stdout.decode().split('\0'):
              if line:
                  meta, path = line.split('\t', 1)
                  tree[prefix + path] = meta.split()[2]
          # the repository's export policy (.gitattributes): developer tooling, workflows, docs and QA evidence stay out
          attrs = subprocess.run(['git', 'show', commit + ':.gitattributes'], check=True, capture_output=True).stdout.decode()
          ignored = sorted(l.split()[0].strip('/') for l in attrs.splitlines() if l.strip() and not l.startswith('#') and 'export-ignore' in l.split()[1:])
          assert ignored == sorted(['tools', '.github', 'docs/integration/evidence', 'docs/audits/evidence', 'docs/audits/COMPREHENSIVE-REVIEW-INSTRUCTIONS.json', 'docs/audits/VIDEO-HIERARCHY.json', '.gitattributes', 'docs/audits/VIDEO-SIZING-INVENTORY.json', 'docs/audits/KEYPAD-COMPLETENESS-INVENTORY.json', 'docs/audits/KEYPAD-COMPLETENESS-MATRIX.csv', 'docs/final-integration/evidence', 'docs', 'QA.md']), ignored
          tree = {k: v for k, v in tree.items() if not any(k == prefix + d or k.startswith(prefix + d + '/') for d in ignored)}
          with zipfile.ZipFile('bm-v13.0.D.zip') as z:
              files = {i.filename: i for i in z.infolist() if not i.is_dir()}
              assert set(files) == set(tree), 'file list differs from the commit'
              for name, blob in tree.items():
                  data = z.read(name)
                  assert hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest() == blob, name
          assert all(n.startswith(prefix) for n in files)
          assert not any('/node_modules/' in n for n in files)
          for need in ['index.html', 'LOCAL-TESTING.txt', 'assets/app-version.json', 'sw.js',
                       'assets/unit6-3d/cross-sections-3d.mjs', 'assets/unit6-3d/viewer.mjs', 'assets/unit6-3d/solid-geometry.mjs', 'assets/unit6-3d/dependency-lock.json',
                       'assets/unit6-3d/vendor/three/three.module.min.mjs', 'assets/unit6-3d/vendor/three/OrbitControls.mjs', 'assets/unit6-3d/vendor/three/LICENSE',
                       'assets/unit6-3d/revolution-geometry.mjs', 'assets/unit6-3d/revolution-viewer.mjs', 'assets/unit6-3d/solids-3d.mjs', 'assets/unit6-3d/scene-kit.mjs', 'assets/unit6-3d/model-toggle.mjs',
                       'assets/unit6-volume.js', 'assets/unit6-core.js', 'assets/unit6.css', 'assets/mathlive/unit6.mjs', 'assets/mathlive/vendor/mathlive/mathlive.min.mjs',
                       'ap-calculus/unit-6-applications-integration/topics/volume-by-cross-sections/non-calculator-practice/index.html',
                       'ap-calculus/unit-6-applications-integration/topics/volume-by-cross-sections/calculator-practice/index.html']:
              assert prefix + need in files, need
          page = zipfile.ZipFile('bm-v13.0.D.zip').read(prefix + 'ap-calculus/unit-6-applications-integration/topics/volume-by-cross-sections/non-calculator-practice/index.html').decode()
          assert '/assets/unit6-3d/cross-sections-3d.mjs' in page
          page = zipfile.ZipFile('bm-v13.0.D.zip').read(prefix + 'ap-calculus/unit-6-applications-integration/topics/volume-by-cross-sections/calculator-practice/index.html').decode()
          assert '/assets/unit6-3d/cross-sections-3d.mjs' in page
          for page in ['non-calculator-practice', 'calculator-practice']:
              html = zipfile.ZipFile('bm-v13.0.D.zip').read(prefix + 'ap-calculus/unit-6-applications-integration/topics/solids-of-revolution/' + page + '/index.html').decode()
              assert '/assets/unit6-3d/solids-3d.mjs' in html, page
          kit = zipfile.ZipFile('bm-v13.0.D.zip').read(prefix + 'assets/unit6-3d/model-toggle.mjs').decode()
          assert 'data-mode="opaque"' in kit and 'data-mode="transparent"' in kit
          assert 'export function displayModes' in zipfile.ZipFile('bm-v13.0.D.zip').read(prefix + 'assets/unit6-3d/scene-kit.mjs').decode()
          print('Files verified against', commit, ':', len(files))
          CHECK
          sha256sum bm-v13.0.D.zip | tee bm-v13.0.D.sha256
      - name: Verify main and the existing releases, publish the experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          TAG='v13.0.D'
          ref() { gh api "repos/$R/git/ref/$1" --jq .object.sha; }
          # every release so far is a prerelease, so there is no "latest" release (404); it must stay that way
          latest() { local t; if t="$(gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null)"; then echo "$t"; else echo none; fi; }
          rel() { gh api "repos/$R/releases/tags/$1" --jq '[.prerelease, .draft, .updated_at, (.assets | map(.name + " " + (.digest // "") + " " + (.size|tostring)) | join(","))] | @tsv'; }
          protected() {
            test "$(ref heads/main)" = "$MAIN_SHA" || { echo '::error::main changed'; exit 1; }
            test "$(ref heads/claude/v13.0a-cross-sections-3d)" = "$V13A_SHA" || { echo '::error::the v13.0.A branch changed'; exit 1; }
            test "$(ref heads/claude/v13.0b-cross-sections-3d-complete)" = "$V13B_SHA" || { echo '::error::the v13.0.B branch changed'; exit 1; }
            test "$(ref heads/claude/v13.0c-solids-revolution-3d)" = "$V13C_SHA" || { echo '::error::the v13.0.C branch changed'; exit 1; }
            rel v13.0.C; rel v13.0.B; rel v13.0.A; rel v12.9.G; rel v12.9.F; rel v12.9.E
          }
          test "$(ref heads/claude/v13.0d-3d-opacity-toggle)" = "$GITHUB_SHA"
          before="$(protected)"; latest_before="$(latest)"
          echo "existing prereleases: $before"; echo "latest release: $latest_before"
          checksum="$(cut -d' ' -f1 bm-v13.0.D.sha256)"
          {
            echo 'EXPERIMENTAL TEST BUILD (Version 13 Beta). Not production, not deployed: production `main` is unchanged. Existing releases, including v13.0.A, v13.0.B and v13.0.C, are unchanged.'
            echo
            echo "Source: branch \`claude/v13.0d-3d-opacity-toggle\`, tested commit $QA_COMMIT, created from the completed v13.0.C branch at cb9738a (from v13.0.B, v13.0.A and main at 9dbb4f8, v12.9.G)."
            echo
            echo '- New: a Transparent | Opaque switch beside Reset view on every Unit 6 3D model (Volume by Cross Sections and Solids of Revolution). Transparent is the default and looks exactly as in v13.0.C; Opaque shows a fully opaque blue solid with its curved surfaces, edges, washer holes and openings.'
            echo '- In Opaque, the highlighted slice (and, for solids of revolution, the region and the axis inside the solid) stays visible: the parts in front are drawn as before, the parts behind the surface faintly with a dashed rim.'
            echo '- Switching is immediate and keeps the question, the geometry, the rotation and the zoom. Reset view and Show/Hide 3D Model work as before. Mouse, keyboard and touch.'
            echo '- Fix: Enter pressed on a 3D model control no longer jumps to the next question.'
            echo '- Every problem, answer check, explanation and 2D graph is unchanged; every other page is unchanged.'
            echo
            echo 'Extract, open a terminal in the folder bm-v13.0.D and run `py -m http.server 8000` (Windows) or `python3 -m http.server 8000`, then open http://localhost:8000/. See LOCAL-TESTING.txt.'
            echo
            echo "SHA-256 of bm-v13.0.D.zip: $checksum"
          } > release-notes.md
          if gh release view "$TAG" --repo "$R" > /dev/null 2>&1; then
            echo "::error::A $TAG release already exists; not changing it."; exit 1
          fi
          gh release create "$TAG" bm-v13.0.D.zip --repo "$R" --target "$QA_COMMIT" --title 'BatchMath v13.0.D — Transparent / Opaque 3D Models (Beta)' --notes-file release-notes.md --prerelease --latest=false
          gh api "repos/$R/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$checksum" <<'CHECK'
          import json, os, sys
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release.json').read_text())
          assert release['tag_name'] == 'v13.0.D' and release['prerelease'] is True and release['draft'] is False
          asset = [a for a in release['assets'] if a['name'] == 'bm-v13.0.D.zip']
          assert len(asset) == 1 and asset[0]['state'] == 'uploaded'
          assert asset[0]['size'] == Path('bm-v13.0.D.zip').stat().st_size
          assert asset[0].get('digest') in (None, 'sha256:' + sys.argv[1])
          print('Release:', release['html_url'])
          print('Download:', asset[0]['browser_download_url'])
          CHECK
          test "$(ref tags/$TAG)" = "$QA_COMMIT"
          test "$(protected)" = "$before" || { echo '::error::main, the v13.0.A/B/C branches or an existing release changed'; exit 1; }
          test "$(latest)" = "$latest_before" || { echo '::error::the latest release changed'; exit 1; }

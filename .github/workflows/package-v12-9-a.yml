name: Package BatchMath v12.9.A
on:
  push:
    branches: [claude/v12.9a-unit6-curriculum-alignment]
    paths: [.github/workflows/package-v12-9-a.yml]
permissions:
  contents: write
jobs:
  package:
    if: github.repository == 'batchmath/BatchMathSite' && github.ref == 'refs/heads/claude/v12.9a-unit6-curriculum-alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_COMMIT: 8e58d2f4cd2513bcc52693f4fa050a4e6218e4f9
      MAIN_SHA: 26ec4f15185c37f9e8843e96a09d583b47babcdf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the reviewed A commit, its v12.8.Y base and a workflow-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$QA_COMMIT"
          test "$(git diff --name-status "$QA_COMMIT" "$GITHUB_SHA")" = $'A\t.github/workflows/package-v12-9-a.yml'
          git merge-base --is-ancestor "$MAIN_SHA" "$QA_COMMIT"
          # the course materials were read outside the repository: no PDF or Word file is added or changed since main
          test -z "$(git diff --name-only --diff-filter=AM "$MAIN_SHA" "$QA_COMMIT" | grep -Ei '\.(pdf|docx?)$' || true)"
          test "$(git show "$QA_COMMIT:assets/app-version.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = '12.9.A'
      - name: Package the reviewed commit and verify every file
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip -9 --prefix=batchmath-site-v12.9.A/ --output=batchmath-site-v12.9.A.zip "$QA_COMMIT"
          unzip -tq batchmath-site-v12.9.A.zip
          python3 - <<'CHECK'
          import hashlib, os, subprocess, zipfile
          commit = os.environ['QA_COMMIT']
          prefix = 'batchmath-site-v12.9.A/'
          tree = {}
          for line in subprocess.run(['git', 'ls-tree', '-r', '-z', commit], check=True, capture_output=True).stdout.decode().split('\0'):
              if line:
                  meta, path = line.split('\t', 1)
                  tree[prefix + path] = meta.split()[2]
          # .gitattributes keeps the developer-only review lab (and itself) out of the package; nothing else
          attrs = subprocess.run(['git', 'show', commit + ':.gitattributes'], check=True, capture_output=True).stdout.decode()
          ignored = sorted(l.split()[0].strip('/') for l in attrs.splitlines() if l.strip() and not l.startswith('#') and 'export-ignore' in l.split()[1:])
          assert ignored == ['.gitattributes', 'tools/review-lab'], ignored
          tree = {k: v for k, v in tree.items() if not (k == prefix + '.gitattributes' or k.startswith(prefix + 'tools/review-lab/'))}
          with zipfile.ZipFile('batchmath-site-v12.9.A.zip') as z:
              files = {i.filename: i for i in z.infolist() if not i.is_dir()}
              assert set(files) == set(tree), 'file list differs from the commit'
              for name, blob in tree.items():
                  data = z.read(name)
                  assert hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest() == blob, name
          bad = [n for n in files if any(c in n for c in '<>:"\\|?*') or n.endswith((' ', '.'))]
          assert not bad, bad
          assert not any('/node_modules/' in n for n in files)
          for need in ['assets/unit6-core.js', 'assets/unit6-frq.js', 'assets/unit6-review.js', 'assets/unit6.css',
                       'ap-calculus/unit-6-applications-integration/topics/comprehensive-review/non-calculator-practice/index.html']:
              assert prefix + need in files, need
          print('Files verified against', commit, ':', len(files))
          CHECK
          sha256sum batchmath-site-v12.9.A.zip | tee batchmath-site-v12.9.A.sha256
      - name: Verify protected refs and publish the v12.9.A prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/claude/v12.9a-unit6-curriculum-alignment" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN_SHA" || { echo '::error::main changed'; exit 1; }
          checksum="$(cut -d' ' -f1 batchmath-site-v12.9.A.sha256)"
          {
            echo 'Review build for teacher testing. Not deployed: production `main` is unchanged (v12.8.Y, 26ec4f1).'
            echo 'Not approved: automated QA passed, and the build awaits the teacher'"'"'s review.'
            echo
            echo "Source: branch \`claude/v12.9a-unit6-curriculum-alignment\`, commit $QA_COMMIT."
            echo
            echo 'Unit 6 (Applications of Integration) rebuilt to match the course materials; everything else is as in v12.8.Y.'
            echo '- Area below and between curves (dx) and in terms of y (dy): crossing the axis, intersections, switching and multiple boundaries, trigonometric, exponential, logarithmic, polynomial and radical curves.'
            echo '- Volume by cross sections (perpendicular to either axis, nine shapes), disks and washers, and shells, about the axes and shifted lines; typed radii, A(x) and integral setups.'
            echo '- Integral setups are typed as integrals and graded by value (any correct method; decimal limits on calculator problems).'
            echo '- Non-Calculator and Calculator Practice pages for Area, Cross Sections and Solids; a Non-Calculator Review and a Calculator Review with multipart area and volume free-response problems and graph free-response problems (written reasoning is not graded; the reason is a choice with a model justification). Retired URLs redirect.'
            echo '- Unit 5 Growth and Decay labeled Calculator Practice with the calculator icon (labels only).'
            echo
            echo 'See docs/v12.9.A-revisions.md (implementation, alignment, inventory, QA, teacher checklist, limitations) and docs/v12.9.A-progress.md. Serve the extracted folder with `py -m http.server 8000`.'
            echo
            echo "SHA-256 of batchmath-site-v12.9.A.zip: $checksum"
          } > release-notes-a.md
          if gh release view v12.9.A --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo '::error::A v12.9.A release already exists; not changing it.'; exit 1
          fi
          gh release create v12.9.A batchmath-site-v12.9.A.zip --repo "$GITHUB_REPOSITORY" --target "$QA_COMMIT" --title 'BatchMath v12.9.A (review build)' --notes-file release-notes-a.md --prerelease --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v12.9.A" > "$RUNNER_TEMP/a-release.json"
          python3 - "$checksum" <<'CHECK'
          import json, os, sys
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'a-release.json').read_text())
          assert release['tag_name'] == 'v12.9.A' and release['prerelease'] is True and release['draft'] is False
          asset = [a for a in release['assets'] if a['name'] == 'batchmath-site-v12.9.A.zip']
          assert len(asset) == 1 and asset[0]['state'] == 'uploaded'
          assert asset[0]['size'] == Path('batchmath-site-v12.9.A.zip').stat().st_size
          assert asset[0].get('digest') in (None, 'sha256:' + sys.argv[1])
          print('Release:', release['html_url'])
          print('Download:', asset[0]['browser_download_url'])
          CHECK
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN_SHA"
